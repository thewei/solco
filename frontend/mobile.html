<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Solco Chat</title>
    <!-- The phone is dark-only (2026-11-07 redesign) and its host sends theme "dark" in every
         state: settle the theme and the --content colour before the first paint, so a phone in
         light system mode never flashes a light page. -->
    <script>
      document.documentElement.dataset.theme = document.documentElement.dataset.themePin = "dark";
    </script>
    <style>
      html {
        background: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile.tsx"></script>
  </body>
</html>
