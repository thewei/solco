<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Solco</title>
    <!-- First paint, before the stylesheet and the module script: the theme
         is settled synchronously from the app-resolved appearance (the
         page's own App code keeps it current afterwards), and html carries
         the same --content pair as theme.css and the native WebView fill. -->
    <script>
      document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
    <style>
      html {
        background: #fcfcfc;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0a0a0a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
