<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Solco</title>
    <!-- First paint before the stylesheet loads: the same --content pair as
         theme.css (and the native WebView fill), so no white flash. -->

      html {
        background: #f5f5f7;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #161618;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
