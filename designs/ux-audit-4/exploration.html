<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solco UX audit 第四轮 — 设计探索</title>
<!--
  自包含，file:// 直接打开。URL hash 预置：#t=header&v=A&s=sessions
  议题 t：header | quota | sessions | remote | newpane | defview
  v = 方案 A/B/C，s = 该议题的状态（页面 / 表面）
  配色取自 designs/ux-audit-3（Solco 深色 token）；mock 不是产品代码。
-->
<style>
:root{--sb:#17171a;--bg:#141516;--card:#18191b;--panel:#1b1c1f;--text:#ececee;--muted:#8b8c92;--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.08);--line:rgba(255,255,255,.07);--border:#333338;--accent:#0a84ff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;--work:#7c83ff}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0c;color:var(--text);font:12px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{all:unset;box-sizing:border-box;cursor:pointer;color:inherit;font:inherit}
.shell{display:flex;min-height:100vh}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;gap:12px}
.label{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#71717a;align-self:flex-start}
.panel{width:318px;flex:none;background:#18181b;border-left:1px solid #27272a;padding:14px;overflow:auto;height:100vh;position:sticky;top:0}
.panel h3{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#71717a;margin:16px 0 6px}
.panel h3:first-child{margin-top:0}
.topics{display:flex;flex-wrap:wrap;gap:4px}
.topics button{padding:4px 9px;border:1px solid #27272a;border-radius:6px;font-size:10.5px;color:#a1a1aa}
.topics button.on{background:#2c2c31;color:#fafafa;border-color:#52525b}
.opt{display:block;padding:8px 10px;border:1px solid #27272a;border-radius:6px;margin-bottom:5px;color:#a1a1aa;font-size:10.5px;line-height:1.45}
.opt b{display:block;color:#fafafa;font-size:11px;margin-bottom:2px}
.opt:hover{border-color:#3f3f46}.opt.on{border-color:#71717a;background:rgba(113,113,122,.12)}
.opt i{font-style:normal;color:var(--ok);font-size:9.5px;margin-left:6px}
.story{font-size:11px;line-height:1.55;color:#a1a1aa}
.story h4{font-size:12px;color:#fafafa;margin:0 0 6px}.story p{margin:0 0 7px}.story ul{margin:0 0 7px;padding-left:16px}.story li{margin-bottom:3px}
.story code{background:#27272a;border-radius:4px;padding:0 4px;font-size:10px;color:#d4d4d8}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid #27272a;border-radius:7px}
.seg button{padding:3px 9px;border-radius:5px;font-size:10.5px;color:#a1a1aa}.seg button.on{background:#2c2c31;color:#fafafa}
.cap{align-self:flex-start;font-size:10.5px;color:#8b8c92;max-width:1040px}
/* ---------- app mock ---------- */
.win{display:grid;grid-template-columns:236px minmax(0,1fr);width:min(100%,1040px);height:600px;border-radius:12px;overflow:hidden;border:1px solid #2a2a2e;background:var(--bg);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.win.nosb{grid-template-columns:minmax(0,1fr)}
.sb{display:flex;flex-direction:column;min-height:0;background:var(--sb);border-right:1px solid var(--line)}
.sbtop{height:38px;flex:none;display:flex;align-items:center;gap:7px;padding:0 14px}
.tl{width:11px;height:11px;border-radius:50%;background:#56565b}
.vtabs{display:flex;gap:2px;padding:0 8px 8px}.vtab{flex:1;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:11px}.vtab.on{background:var(--sel);color:var(--text)}
.sbody{flex:1;min-height:0;overflow:hidden;padding:0 8px 8px}
.sh{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px;font-weight:600}.sh .c{margin-left:auto;font-weight:400;color:var(--muted);font-size:10.5px}
.glab{height:22px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:#76777d}
.row{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 8px;border-radius:7px;min-width:0}.row.on{background:var(--sel)}.row:hover{background:var(--hover)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .nm small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.row.tall{height:42px}
.mk{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.sbfoot{height:44px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.tb{height:40px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 12px;min-width:0}
.cr{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:13px;white-space:nowrap;gap:6px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.cr:hover{background:var(--hover);color:var(--text)}.cr.cur{color:var(--text)}.cr.static:hover{background:none;color:inherit}
.sep{color:#5d5e64;font-size:12px}
.big{font-size:20px;font-weight:700;letter-spacing:-.01em;padding:0 8px}.big.par{font-weight:500;color:var(--muted)}
.facts{color:var(--muted);font-size:11px;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{margin-left:auto;display:flex;align-items:center;gap:4px}
.ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}.ib:hover{background:var(--hover);color:var(--text)}.ib.on{background:var(--sel);color:var(--text)}
.ibt{height:28px;padding:0 9px;border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px}.ibt:hover{background:var(--hover);color:var(--text)}.ibt.on{background:var(--sel);color:var(--text)}
.body{flex:1;min-height:0;overflow:hidden;padding:6px 22px 18px;display:flex;flex-direction:column;gap:14px}
.scroll{overflow:auto}
/* status slot */
.sd{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.sd.w{background:var(--work)}.sd.a{background:var(--warn)}.sd.g{background:var(--ok)}.sd.r{background:var(--bad)}
.sd.i{background:none;border:1.5px solid #6b6c72;width:9px;height:9px}
.sd.spin{width:10px;height:10px;border-radius:50%;border:1.8px solid rgba(124,131,255,.25);border-top-color:var(--work);background:none;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:9px;font-size:10px;font-weight:600;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.pill.run{background:rgba(124,131,255,.16);color:#a9aeff}.pill.blk{background:rgba(255,159,10,.16);color:#ffb340}.pill.ok{background:rgba(48,209,88,.14);color:#52d878}.pill.bad{background:rgba(255,69,58,.15);color:#ff7a70}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--border);font-size:12px;white-space:nowrap}.btn:hover{background:var(--hover)}
.btn.pri{background:var(--text);color:#111;border-color:var(--text);font-weight:600}.btn.sm{height:24px;padding:0 9px;font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}.sm{font-size:11px}.xs{font-size:10.5px}
.menu{position:absolute;z-index:5;background:#232326;border:1px solid #3a3a3f;border-radius:10px;padding:4px;min-width:212px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.mi{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:6px;font-size:12px}.mi:hover{background:var(--sel)}
.mi .k{margin-left:auto;color:var(--muted);font-size:10.5px}.mi.sepl{height:1px;margin:4px 6px;background:var(--line);padding:0}
.kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:rgba(255,255,255,.1);font-size:10px;color:#cfcfd4}
.hl{outline:1.5px dashed rgba(255,159,10,.75);outline-offset:3px;border-radius:8px}
.flag{position:absolute;z-index:6;background:#ff9f0a;color:#1a1000;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
/* sessions */
.tabsr{display:flex;gap:6px;align-items:center}
.chip{height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.chip.on{background:var(--sel);color:var(--text);border-color:#4a4a50}
.srow{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 12px;border-radius:9px;position:relative}.srow:hover{background:var(--hover)}
.srow .t{flex:1;min-width:0}.srow .t b{display:flex;align-items:center;gap:8px;font-weight:500;font-size:12.5px}
.srow .t b span.tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .t small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
.srow .fig{color:var(--muted);font-size:11px;text-align:right;width:120px;flex:none}
.srow .act{display:none;gap:4px}.srow:hover .act{display:flex}.srow:hover .fig{display:none}
.srow.live{background:linear-gradient(90deg,rgba(124,131,255,.08),transparent 60%)}
.grp{font-size:10.5px;color:#76777d;font-weight:600;padding:6px 12px 2px;letter-spacing:.02em}
/* quota */
.qc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.qh{display:flex;align-items:center;gap:9px}.qh b{font-size:13px;font-weight:600}
.qw{display:grid;grid-template-columns:96px 1fr 64px 118px;align-items:center;gap:12px;font-size:11.5px}
.qw .nmw{color:var(--text)}.qw .rs{color:var(--muted);text-align:right;font-size:10.5px}
.qw .pc{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:visible}
.bar i{display:block;height:100%;border-radius:3px;background:var(--work)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar u{position:absolute;top:-2px;width:1.5px;height:10px;background:rgba(255,255,255,.55)}
.qd .qw{grid-template-columns:116px 1fr 40px;gap:9px;font-size:11px}.qw .nmw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qd .qw .rs{display:none}
.qd.qc{padding:10px 12px;gap:7px}
.hero{display:flex;align-items:baseline;gap:6px}.hero b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.sumstrip{display:flex;align-items:center;gap:18px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.sumstrip .it{display:flex;flex-direction:column;gap:2px}.sumstrip .it small{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.06em}.sumstrip .it b{font-size:15px;font-weight:600}
.stat3{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end}
.stat3 .s{padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}.stat3 .s small{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.06em}.stat3 .s b{display:block;font-size:17px;margin:2px 0}
.pop{width:440px;background:#232326;border:1px solid #3a3a3f;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);overflow:hidden}
.pophd{display:flex;align-items:center;height:40px;padding:0 12px;gap:10px;border-bottom:1px solid var(--line)}
.ptab{padding:4px 9px;border-radius:7px;color:var(--muted);font-size:11.5px}.ptab.on{background:var(--sel);color:var(--text)}
/* settings */
.set{max-width:700px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grp2{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.gt{font-size:11px;font-weight:600;color:var(--muted);padding:0 4px 6px}
.srw{display:flex;align-items:center;gap:14px;min-height:46px;padding:8px 14px;border-top:1px solid var(--line)}.srw:first-child{border-top:0}
.srw .l{flex:1;min-width:0}.srw .l b{font-weight:500;font-size:12.5px;display:block}.srw .l small{color:var(--muted);font-size:10.5px;line-height:1.35;display:block;margin-top:1px}
.fld{height:28px;min-width:90px;padding:0 10px;border-radius:8px;border:1px solid var(--border);display:inline-flex;align-items:center;color:var(--muted);font-size:12px}
.sw{width:30px;height:18px;border-radius:9px;background:#3a3a3f;position:relative;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--ok)}.sw.on::after{left:14px}
.hero2{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.hero2 .big2{font-size:15px;font-weight:600}
.dev{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}.dev:first-child{border-top:0}
.step{display:flex;gap:12px}.stn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#2c2c31;flex:none}.stn.ok{background:var(--ok);color:#06210f}
.disc{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:6px 4px}.disc:hover{color:var(--text)}
/* tabbar */
.tabbar{display:flex;align-items:center;gap:2px;height:40px;padding:0 10px;min-width:0}
.tab{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:12px;min-width:110px;max-width:170px}.tab.on{background:var(--sel);color:var(--text)}
.split{display:inline-flex;align-items:center;border-radius:8px}.split:hover{background:var(--hover)}.split .p{width:28px;height:28px;display:grid;place-items:center;color:var(--muted)}.split .d{width:16px;height:28px;display:grid;place-items:center;color:var(--muted);font-size:9px;border-radius:0 8px 8px 0}.split .d:hover{background:var(--sel);color:var(--text)}
.launcher{margin:auto;display:grid;grid-template-columns:repeat(3,150px);gap:10px}
.lc{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.lc:hover{border-color:#4a4a50}.lc b{font-size:12.5px}.lc small{color:var(--muted);font-size:10.5px}
.lc.term{background:transparent;border-style:dashed}
.big-mk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
</style>
</head>
<body>
<div class="shell">
  <main class="stage" id="stage"></main>
  <aside class="panel">
    <h3>议题</h3><div class="topics" id="topics"></div>
    <h3>方案</h3><div id="variants"></div>
    <h3 id="stH">状态</h3><div id="states"></div>
    <h3>Story</h3><div class="story" id="story"></div>
  </aside>
</div>
<script>
/* ============ 数据 ============ */
const BR = {cc:['#d97757','C'],cx:['#10a37f','X'],cu:['#3a3a3f','⌗'],pi:['#6d5bd0','π'],om:['#4a8fe7','O'],ag:['#4285f4','A'],tm:['#4b4b50','>_'],zh:['#2b6cff','Z'],gh:['#6e5494','G']};
const mk = (k,s)=>`<span class="mk" style="background:${BR[k][0]};${s||''}">${BR[k][1]}</span>`;
const dots='<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>';
const refresh='↻';

function vtabs(on){return `<div class="vtabs">${['▣','⎇','☰','▤','⌁'].map((g,i)=>`<div class="vtab ${i===on?'on':''}">${g}</div>`).join('')}</div>`}
function sidebar(kind){
  let body='';
  if(kind==='sessions'){
    body=`<div class="sh">solco <span class="c">⌄</span></div>
    <div class="row on"><span>☰</span><span class="nm">This project</span><span class="muted xs">128</span></div>
    <div class="row"><span>◌</span><span class="nm">All sessions</span><span class="muted xs">1,204</span></div>
    <div style="height:1px;background:var(--line);margin:6px 4px"></div>
    <div class="row"><span>◔</span><span class="nm">Quota</span></div>`;
  }else if(kind==='quota'){
    body=`<div class="sh">solco <span class="c">⌄</span></div>
    <div class="row"><span>☰</span><span class="nm">This project</span><span class="muted xs">128</span></div>
    <div class="row"><span>◌</span><span class="nm">All sessions</span><span class="muted xs">1,204</span></div>
    <div style="height:1px;background:var(--line);margin:6px 4px"></div>
    <div class="row on"><span>◔</span><span class="nm">Quota</span></div>`;
  }else if(kind==='settings'){
    body=['General','Terminal','Agents','Git','Quota','Voice','Remote Access','Diagnostics'].map(x=>`<div class="row ${x==='Remote Access'?'on':''}"><span class="nm">${x}</span></div>`).join('');
  }else{ // workspace
    body=`<div class="sh">Workspaces <span class="c">3</span></div>
    <div class="row on"><span class="mk" style="background:#3b5bdb">S</span><span class="nm">solco<small>main · 12 files</small></span><span class="muted xs">3 panes</span></div>
    <div class="row"><span class="mk" style="background:#2f9e44">M</span><span class="nm">solco-mobile<small>main</small></span></div>
    <div class="row"><span class="mk" style="background:#c2255c">H</span><span class="nm">herdr<small>dev</small></span></div>
    <div class="sh" style="margin-top:8px">Agents <span class="c">4</span></div>
    <div class="glab">solco</div>
    <div class="row tall">${mk('cc')}<span class="nm">Fix flaky test<small>solco · 2m</small></span><span class="sd spin"></span></div>
    <div class="row tall">${mk('cx')}<span class="nm">Quota page<small>solco · 14m</small></span><span class="sd a"></span></div>
    <div class="row tall">${mk('om')}<span class="nm">Sidebar polish<small>solco · 1h</small></span><span class="sd i"></span></div>`;
  }
  const settingsLike = kind==='settings';
  return `<aside class="sb"><div class="sbtop"><i class="tl"></i><i class="tl"></i><i class="tl"></i></div>${settingsLike?'':vtabs(kind==='workspace'?0:kind==='quota'||kind==='sessions'?2:3)}<div class="sbody">${body}</div><div class="sbfoot"><span>⌂</span><span class="sm" style="flex:1">This Mac · default</span><span>⚙</span></div></aside>`;
}
const win=(sb,tb,body,extra='')=>`<div class="win ${sb?'':'nosb'}" style="position:relative">${sb?sidebar(sb):''}<section class="main">${tb}${body}${extra}</section></div>`;
const tools=(inner='')=>`<div class="tools">${inner}<span class="ib" title="Actions">${dots}</span></div>`;

/* ============ 议题 1：标题栏 → 面包屑 ============ */
const PAGES={
  sessions:{label:'Sessions',crumbs:['Sessions'],proj:true,sb:'sessions'},
  detail:{label:'Session 详情',crumbs:['Sessions','Fix flaky test in scheduler'],proj:true,sb:'sessions',facts:'solco · Claude Code · opus-4.5'},
  quota:{label:'Quota',crumbs:['Sessions','Quota'],proj:true,sb:'quota'},
  settings:{label:'Settings',crumbs:['Settings','Remote Access'],proj:false,sb:'settings'},
  files:{label:'Files',crumbs:['Files','nativeui','shell.go'],proj:true,sb:'sessions'},
};
function pageBody(p){
  if(p==='sessions'||p==='detail') return `<div class="body"><div class="tabsr"><span class="chip on">All 128</span><span class="chip">${mk('cc','width:12px;height:12px;font-size:7px')} Claude 71</span><span class="chip">${mk('cx','width:12px;height:12px;font-size:7px')} Codex 34</span><span class="chip">pi 9</span><span class="chip">omp 14</span></div>
    <div class="grp">TODAY</div>
    ${[['cc','Fix flaky test in scheduler','2m'],['cx','Quota page: one card per row','14m'],['om','Sidebar polish','1h'],['cc','Remote access settings','3h']].map(r=>`<div class="srow">${mk(r[0])}<div class="t"><b><span class="tt">${r[1]}</span></b><small>solco · main</small></div><div class="fig">48.2k tokens · ${r[2]}</div></div>`).join('')}</div>`;

  return `<div class="label">Settings › Remote Access</div>${win('settings',`<div class="tb"><span class="cr">Settings</span><span class="sep">›</span><span class="cr cur">Remote Access</span>${tools()}</div>`,`<div class="body scroll"><div class="set">${content}</div></div>`)}<div class="cap">${{A:'A · 状态优先：一张状态卡（地址 / 链路 / 主操作 Pair a Phone）+ 已配对手机；端口、Relay、P2P 全部折进一个 Advanced。行数 14 → 3（默认折叠）。',B:'B · 三步：选网络 → 配对 → 手机列表；Advanced 独立子页。流程最清晰，但已配置过的用户每次仍看到步骤。',C:'C · 现状（参照）：4 个分组 / 14 行 / 3 个 “Status” 行 / 每行一段说明。'}[v]}（可点 Access 分段、Advanced）</div>`;
}

/* ============ 议题 7：新建 Tab / Pane 选 Agent ============ */
const LAUNCH=[['cc','Claude Code','last'],['cx','Codex'],['om','omp'],['pi','pi'],['cu','Cursor Agent'],['ag','Antigravity']];
function tabbar(plus,menu){
  return `<div class="tabbar"><span class="tab">${mk('cc','width:14px;height:14px;font-size:8px')}Fix flaky test<span style="flex:1"></span><span class="sd spin" style="width:9px;height:9px"></span></span><span class="tab on">${mk('tm','width:14px;height:14px;font-size:7px')}zsh<span style="flex:1"></span></span><span class="tab">${mk('cx','width:14px;height:14px;font-size:8px')}Quota page<span style="flex:1"></span><span class="sd a"></span></span>${plus}<div class="tools"><span class="ib">${dots}</span></div></div>`;
}
function renderNewPane(v,s){
  const list=LAUNCH.map((a,i)=>`<div class="mi">${mk(a[0])}<span>${a[1]}</span>${a[2]?'<span class="pill" style="margin-left:6px">Last used</span>':''}<span class="k">${v==='B'?`<span class="kbd">${i+1}</span>`:''}</span></div>`).join('')+`<div class="mi sepl"></div><div class="mi">${mk('tm')}<span>Terminal</span><span class="k">${v==='B'?'<span class="kbd">0</span>':'⌘T'}</span></div>`;
  let plus='',menu='',body='<div class="body" style="align-items:center;justify-content:center"><div class="muted">zsh — ~/solco</div></div>',cap='';
  if(v==='A'){
    plus=`<span class="split"><span class="p">+</span><span class="d">▾</span></span>`;
    menu=s==='menu'?`<div class="menu" style="left:0;top:34px"><div class="muted xs" style="padding:4px 8px">New Tab in solco</div>${list}</div>`:'';
    cap='A · 「+ ▾」分裂按钮（VS Code 终端同款）：点 + = 用上次选的那个（首次 = Terminal，行为不变），点 ▾ 出清单。清单按最近使用排序，最近的一个在最前并带 Last used，Terminal 永远垫底。';
  }else if(v==='B'){
    plus=`<span class="split"><span class="p" style="background:var(--sel);color:var(--text);border-radius:8px">+</span></span>`;
    menu=s==='menu'?`<div class="menu" style="left:0;top:34px"><div class="muted xs" style="padding:4px 8px">Start in solco</div>${list}</div>`:'';
    cap='B · 「+」永远弹清单（所见即所选）：数字键直达（1–6 Agent，0 Terminal），⌘T 仍直接开 Terminal。每次多一次点击，但永不误开错类型。';
  }else{
    plus=`<span class="split"><span class="p">+</span></span>`;
    body=`<div class="body" style="justify-content:center;align-items:center"><div style="text-align:center;margin-bottom:6px"><b style="font-size:15px;font-weight:600">Start something in solco</b><div class="muted sm">⌘T opened this tab — pick what runs in it</div></div><div class="launcher">${LAUNCH.map(a=>`<div class="lc"><div class="big-mk" style="background:${BR[a[0]][0]}">${BR[a[0]][1]}</div><b>${a[1]}</b><small>${a[2]?'Last used':'&nbsp;'}</small></div>`).join('')}<div class="lc term"><div class="big-mk" style="background:#4b4b50">>_</div><b>Terminal</b><small>plain shell</small></div></div></div>`;
    cap='C · 新 Tab 先落到「启动页」（Chrome 新标签页式）：卡片网格，Terminal 在最后一格、虚线描边。最直观，但 Tab 出现后还要再点一次，且需要一个新的“待选”Tab 状态（Herdr 里它已是 shell Tab）。';
  }
  const flag=s==='menu'||v==='C'?'':`<div class="flag" style="left:0;top:34px">点 ▾ 选 Agent（切到「菜单打开」查看）</div>`;
  return `<div class="label">新建 Tab（Tab 栏 + / 侧栏项目 + / ⌘T）</div><div style="position:relative;width:min(100%,1040px)"><div class="win" style="position:relative">${sidebar('workspace')}<section class="main">${tabbar(`<span style="position:relative">${plus}${menu}${flag}</span>`)}${body}</section></div></div><div class="cap">${cap}<br>落点：<code>app.SessionStarter.Kinds()</code>（手机端已在用；Terminal 排最前，桌面入口把它倒到最后，其余按 <code>Session.RecentLaunchKinds</code> MRU）。<b>Split 出来的 Pane</b>：SessionStarter 目前只建 Tab，Split 选 Agent 需要 “split → 在新 pane 起 Agent” 两段事务，建议 v1 不含，列入决策问题。</div>`;
}

/* ============ 议题 6：默认视图 TUI / Chat ============ */
function renderDefView(v,s){
  const seg=`<span class="seg"><button class="${s==='term'?'on':''}" data-st="term">Terminal (TUI)</button><button class="${s==='chat'?'on':''}" data-st="chat">Chat</button></span>`;
  const note=v==='A'?'Applies to an Agent pane the first time you open it. After that each pane remembers the view you last used.':'Always opens Agent panes in this view, whatever you used last time.';
  const rows=`<div class="grp2"><div class="srw"><div class="l"><b>Open Agent panes in</b><small>${note}</small></div>${seg}</div>${v==='B'?'':`<div class="srw"><div class="l"><b>Remember the view per pane</b><small>The existing pane memory (survives restarts).</small></div><span class="sw on"></span></div>`}</div>`;
  return `<div class="label">Settings › General › Window（新增一行）</div>${win('settings',`<div class="tb"><span class="cr">Settings</span><span class="sep">›</span><span class="cr cur">General</span>${tools()}</div>`,`<div class="body"><div class="set"><div><div class="gt">Window</div><div class="grp2"><div class="srw"><div class="l"><b>Show Tabs in Sidebar</b></div><span class="sw"></span></div></div></div><div><div class="gt">Agents</div>${rows}</div></div></div>`)}<div class="cap">${{A:'A · 默认值 + 记忆并存：新窗格取默认值；用户在某窗格切过，则该窗格记住（现有 <code>paneSurfaceMemo</code>）。零回归：已有记忆全部保留。',B:'B · 默认值压过记忆：每次进 Agent 窗格都回到默认视图。更可预期，但推翻 2026-10-31「窗格表面记忆」决策、切一次 Chat 就丢。'}[v]}<br>只作用于有 Agent 的窗格；纯 shell 窗格始终 Terminal；Chat 不可绑定（无会话源）时回落 Terminal。设置项：<code>General.AgentView</code> = ""|"terminal"|"chat"。</div>`;
}

/* ============ 注册 ============ */
const TOPICS={
 header:{label:'① 标题栏',vars:{A:['A 页面名面包屑','第一段是页面名；进内页追加一段','rec'],B:['B 项目为根','项目芯片起头，与侧栏项目头同一切换器'],C:['C 现状（参照）','20pt 大标题']},states:{sessions:'Sessions',detail:'Session 详情',quota:'Quota',settings:'Settings',files:'Files'},def:'sessions',render:renderHeader,
  story:`<h4>所有页面统一面包屑</h4><p>现状：<code>route_header.go</code> 的 <code>routeHeaderBlock</code> 把页标题画成 20pt 粗体；Terminal/Chat 却是 shadcn 式面包屑。两套语言并存。</p><ul><li><b>推翻</b>2026-10-29 shadcn 决策中「内页 20pt 标题留到 Phase 5」，现在就做。</li><li>面包屑组件复用 <code>breadcrumbRow</code> 的 ghost 芯片 + 独立 chevron；父级可点回退；<code>titleTip</code>/<code>facts</code> 保留（facts 变 muted 尾注）。</li><li>守卫要改：<code>unified_header_test.go</code>（单行 Title 大字）、<code>modal_title_test.go</code>（Title 20 只许 route_header 用——结论变为 Typography().Title 无人使用，可删令牌）。</li><li>页内二级标题（如 Quota 首启的「Turn on the agents you use」）是 Heading 16，不在本次范围。</li></ul>`},
 quota:{label:'② Quota',vars:{A:['A 总览条 + Used/Left 进标题栏','一条总览 + Needs a look；开关与 Refresh 同排','rec'],B:['B 开关在内容工具行','Used/Left 右对齐、挨着 Updated'],C:['C 无开关，只读 Left','最简；丢失 Used 读法']},states:{page:'内页 /quota',popover:'Header 浮层'},def:'page',render:renderQuota,
  story:`<h4>同一卡片，两种密度</h4><p>现状两套渲染：浮层 <code>quotaMiniCard</code>（只露 headline 一个窗口、固定 96pt 高）与内页 <code>usageCard</code>（全部窗口 + hero/compact/bar 三种版式 + 30 天活动 + 来源行），并列为卡片网格。所以同一家的数字、窗口数量、标签都对不上。</p><ul><li>抽一个 <code>quotaCardModel(id)</code> 纯投影（headline、窗口列表、状态、plan、freshness），两处只负责密度：<b>full</b>（内页：重置倒计时列、活动条、来源行）/ <b>compact</b>（浮层：窗口全列、无倒计时列）。</li><li>一行一张：去掉 <code>Wrap + Basis</code> 的网格。</li><li>总览：三张大数字卡 → 一条 + 「Needs a look」（≥80% 或 pace 预测在重置前耗尽、需设置/过期的来源），数据全部来自已有 <code>Result</code>/<code>Pace</code>。</li><li>Used/Left 位置见方案；手机端 <code>/quota</code> 线格式不变。</li></ul>`},
 sessions:{label:'③ Sessions ↔ Agent',vars:{A:['A 行内状态胶囊 + Go to pane','列表顺序不变；运行中的行带胶囊，主操作改 Go to pane','rec'],B:['B 「Running now」置顶分组','从历史里拎出来置顶'],C:['C A + Running 筛选 + 反向链接','双向关联，改动面最大']},states:{list:'列表',detail:'详情页'},def:'list',render:renderSessions,
  story:`<h4>会话是否在运行</h4><p>已有机制：<code>requestContinue</code> 用 <code>liveAgentIdentities()</code>（Herdr <code>agent_session</code>，Claude 经 <code>hookIdentities</code> 补回）+ <code>PlanHistoryContinuation</code> → <code>StrategyAlreadyLive</code> → <code>showPane</code>。所以「点 Continue 跳到窗格」后端已通，缺的是：<b>列表上看不出它在运行</b>，且 Continue 的文案/落点没有告诉你「它会跳走」。</p><ul><li>新增 <code>liveSessionIndex</code>：从同一份投影（每次 apply 重建，渲染零 IO）建 <code>session key → {paneID, status}</code>；Trash 的运行保护也能共用它。</li><li>行内胶囊颜色 = 唯一状态槽（working/blocked/idle）。</li><li>跳转后落点：先 <code>selectPane</code>，再按 <code>paneSurfaceMemo</code> 的表面（Chat/Terminal）。</li><li>只读 History 的边界不变：不新增 Herdr 方法。</li></ul>`},
 remote:{label:'⑤ Remote Access',vars:{A:['A 状态优先 + Advanced 折叠','一张状态卡 + 手机列表','rec'],B:['B 三步流程','选网络 → 配对 → 手机；Advanced 子页'],C:['C 现状（参照）','4 组 14 行']},states:{page:'页面'},def:'page',render:renderRemote,
  story:`<h4>去掉什么</h4><ul><li>三个 Status 行（Listener / Relay / P2P）→ 并入一张状态卡。</li><li>Address 行 → 自动选择，状态卡里显示；仅在候选地址变化时出「Use …」提示（保留 <code>remoteAddressStale</code> 逻辑）。</li><li>Port / Relay 地址与 Key / P2P / ICE / TURN → Advanced 折叠；Relay 的明文警告缩成一句，完整说明移到悬停提示。</li><li>每行下方的灰色说明段（Access 的 4 句、Pair 的“6 分钟”等）基本删除。</li></ul><p>数据与行为不变：<code>settings.Remote</code> 字段、<code>remotehost.Server</code>、配对二维码模态原样复用；<code>settings_search.go</code> 的标签索引随行改名（<code>TestSettingsIndexCoversEveryRow</code> 会拦）。</p>`},
 newpane:{label:'⑦ 新建 Tab 选 Agent',vars:{A:['A + ▾ 分裂按钮','点 + 用上次的；▾ 出 MRU 清单，Terminal 垫底','rec'],B:['B + 永远弹清单','数字键直达'],C:['C 新 Tab 启动页','卡片网格']},states:{closed:'菜单收起',menu:'菜单打开'},def:'menu',render:renderNewPane,
  story:`<h4>最近使用排前</h4><ul><li>MRU 存 <code>settings.Session.RecentLaunchKinds</code>（只存 kind 字符串，不含任何内容）。</li><li>Kinds 来自 <code>SessionStarter.Kinds()</code>（<code>herdr agent start --help</code> 解析，10 分钟缓存；手机端已用同一份）。未安装的 Agent 沿用其 <code>UnavailableReason</code> 灰显。</li><li>入口三处共用：Tab 栏 +、侧栏项目 +、⌘T；命令面板 “New Tab with Agent…”。</li><li>走既有 <code>RunLaunchTransaction</code>，Terminal 走既有 <code>CreateTab</code>。无 <code>--takeover</code>。</li></ul>`},
 defview:{label:'⑥ 默认视图',vars:{A:['A 默认值 + 窗格记忆并存','新窗格取默认；切过的窗格记住','rec'],B:['B 默认值压过记忆','每次都回默认']},states:{term:'选中 Terminal',chat:'选中 Chat'},def:'chat',render:renderDefView,
  story:`<h4>落点很小</h4><p><code>syncWorkspaceForSelection</code> / <code>reconcilePaneSurface</code> / <code>openAgentFromSidebar</code> 都读 <code>paneSurfaceMemo[pane]</code>。只需在「无记忆」分支改读 <code>General.AgentView</code>。</p>`},
};

/* ============ 外壳 ============ */
const q=new URLSearchParams(location.hash.slice(1));
let topic=q.get('t')||'header', variant=q.get('v')||'A', state=q.get('s')||null;
function setHash(){history.replaceState(null,'','#t='+topic+'&v='+variant+'&s='+state)}
function paint(){
  const T=TOPICS[topic]; if(!T.vars[variant]) variant='A'; if(!T.states[state]) state=T.def;
  if(topic==='quota'&&variant==='C') qLeft=true;
  document.getElementById('topics').innerHTML=Object.entries(TOPICS).map(([k,t])=>`<button data-t="${k}" class="${k===topic?'on':''}">${t.label}</button>`).join('');
  document.getElementById('variants').innerHTML=Object.entries(T.vars).map(([k,x])=>`<div class="opt ${k===variant?'on':''}" data-v="${k}"><b>${x[0]}${x[2]?'<i>推荐</i>':''}</b>${x[1]}</div>`).join('');
  document.getElementById('stH').textContent='状态';
  document.getElementById('states').innerHTML=`<div class="seg">${Object.entries(T.states).map(([k,l])=>`<button data-s="${k}" class="${k===state?'on':''}">${l}</button>`).join('')}</div>`;
  document.getElementById('story').innerHTML=T.story;
  document.getElementById('stage').innerHTML=T.render(variant,state);
  setHash();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'),v=e.target.closest('[data-v]'),s=e.target.closest('[data-s]'),qt=e.target.closest('[data-qt] button'),ra=e.target.closest('[data-ra] button'),adv=e.target.closest('[data-adv]'),st=e.target.closest('[data-st]');
  if(t){topic=t.dataset.t;variant='A';state=null;paint()}
  else if(v&&v.closest('#variants')){variant=v.dataset.v;paint()}
  else if(s&&s.closest('#states')){state=s.dataset.s;paint()}
  else if(qt){qLeft=qt.dataset.l==='1';paint()}
  else if(ra){rAccess=+ra.dataset.i;paint()}
  else if(adv){rAdv=!rAdv;paint()}
  else if(st&&topic==='defview'){state=st.dataset.st;paint()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&topic==='newpane'&&state==='menu'){state='closed';paint()}});
paint();
</script>
