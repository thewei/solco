<!DOCTYPE html>
<!--
  Solco · Projects workbench & run view —— Design Storybook（interactive-design-exploration）

  直接用浏览器打开（file://），无外部依赖、无构建。
  变体 A/B/C = “Project 首页放什么”这一个决策点的三种结构；Maps = 全流程图（生命周期 / 分层 / 上下文管线 / 控制矩阵 / TUI 对照）。
  Task 运行视图、Library、New task 面板在 A/B/C 中共用（那是推荐的基础设施，不是被比较的对象）。

  Tokens 来自真实实现：designs/chat-view 与 designs/subagents 的墨色四档（--i1..--i4）、
  design_system.go（Radius Control 6 / Row 8 / Card 10 / Pill 999；无投影、hairline 边）、
  status_indicator.go（working=转圈 / idle·resolved=空心环 / 其余=实心点；16pt 槽位）。
  数据形状来自真实取证（见 README「Phase 0」）：herdr-projects 1.2.26 的 list/details --json
  （stage / msg / reviews / pr / plan / limits / worktree / branch）与其 docs/*.md 的状态机。
  URL hash 可预置：#v=A&scene=home&theme=light&w=1120   （Maps：#v=M&scene=life）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solco · Projects workbench & run view</title>

<!-- ============================ SHELL (Design Storybook) ============================ -->
<style>
  [data-ide-shell]{--shell-bg:#0f0f10;--shell-panel:#18181b;--shell-border:#27272a;--shell-text:#fafafa;--shell-muted:#a1a1aa;--shell-accent:#71717a;--panel-w:332px;
    box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--shell-bg);color:var(--shell-text);min-height:100vh;margin:0}
  [data-ide-shell] *{box-sizing:border-box}
  [data-ide-shell] .ide-layout{display:flex;min-height:100vh}
  [data-ide-shell] .ide-stage{flex:1;position:relative;display:flex;flex-direction:column;min-height:100vh;min-width:0;background:#0b0b0c}
  [data-ide-shell] .ide-stage-label{position:absolute;top:12px;left:14px;z-index:20;font-size:9px;font-weight:600;color:var(--shell-accent);text-transform:uppercase;letter-spacing:.06em;pointer-events:none}
  [data-ide-shell] .ide-panel-collapse-btn{position:absolute;top:10px;right:10px;z-index:30;width:28px;height:28px;border-radius:6px;border:1px solid var(--shell-border);background:var(--shell-panel);color:var(--shell-muted);cursor:pointer;font-size:12px}
  [data-ide-shell] .ide-artboard-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:34px 24px 14px;min-width:0}
  [data-ide-shell] .ide-artboard{width:100%;display:flex;justify-content:center;min-width:0}
  [data-ide-shell] .ide-story-panel{width:var(--panel-w);flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--shell-border);background:var(--shell-panel);transition:width .2s;overflow:hidden;height:100vh;position:sticky;top:0}
  [data-ide-shell] .ide-layout.panel-collapsed .ide-story-panel{width:0;border-left:none}
  [data-ide-shell] .ide-panel-expand-btn{display:none;position:fixed;top:10px;right:10px;z-index:40;width:28px;height:28px;border-radius:6px;border:1px solid var(--shell-border);background:var(--shell-panel);color:var(--shell-muted);cursor:pointer;font-size:12px}
  [data-ide-shell] .ide-layout.panel-collapsed .ide-panel-expand-btn{display:grid;place-items:center}
  [data-ide-shell] .ide-panel-header{padding:12px 14px 8px;border-bottom:1px solid var(--shell-border);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--shell-muted);white-space:nowrap}
  [data-ide-shell] .ide-panel-controls{flex:1;overflow-y:auto;padding:12px 14px;min-height:0}
  [data-ide-shell] .ide-section-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--shell-accent);margin:0 0 6px}
  [data-ide-shell] .ide-section-title:not(:first-child){margin-top:14px}
  [data-ide-shell] .ide-variant-card,[data-ide-shell] .ide-state-card{padding:8px 10px;border-radius:6px;border:1px solid var(--shell-border);margin-bottom:5px;cursor:pointer;transition:border-color .12s,background .12s;font-size:10px;line-height:1.4;color:var(--shell-muted)}
  [data-ide-shell] .ide-variant-card:hover,[data-ide-shell] .ide-state-card:hover{border-color:#3f3f46}
  [data-ide-shell] .ide-variant-card.active,[data-ide-shell] .ide-state-card.active{border-color:var(--shell-accent);background:rgba(113,113,122,.1)}
  [data-ide-shell] .ide-variant-card h2{font-size:11px;font-weight:600;margin:0 0 2px;color:var(--shell-text)}
  [data-ide-shell] .ide-variant-card p{margin:0}
  [data-ide-shell] .ide-state-card strong{display:block;color:var(--shell-text);font-size:10.5px;font-weight:500}
  [data-ide-shell] .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px;font-size:10.5px;color:var(--shell-muted)}
  [data-ide-shell] .shell-seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--shell-border);border-radius:7px;flex-wrap:wrap;justify-content:flex-end}
  [data-ide-shell] .shell-seg button{all:unset;cursor:pointer;padding:3px 8px;border-radius:5px;font-size:10px;color:var(--shell-muted)}
  [data-ide-shell] .shell-seg button.on{background:#2c2c31;color:var(--shell-text)}
  [data-ide-shell] .ide-panel-story{border-top:1px solid var(--shell-border);flex-shrink:0}
  [data-ide-shell] .ide-story-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:none;background:rgba(255,255,255,.02);color:var(--shell-muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
  [data-ide-shell] .ide-story-toggle:hover{color:var(--shell-text);background:rgba(255,255,255,.04)}
  [data-ide-shell] .ide-story-body{padding:0 14px 14px;font-size:11px;line-height:1.55;color:var(--shell-muted);max-height:250px;overflow-y:auto}
  [data-ide-shell] .ide-layout.story-collapsed .ide-story-body{display:none}
  [data-ide-shell] .ide-story-body h1{font-size:13px;font-weight:600;color:var(--shell-text);margin:0 0 6px}
  [data-ide-shell] .ide-story-body p{margin:0 0 8px}
  [data-ide-shell] .ide-story-body ul{margin:0 0 8px;padding-left:16px}
  [data-ide-shell] .ide-story-body li{margin-bottom:4px}
  [data-ide-shell] .ide-story-body b{color:var(--shell-text);font-weight:600}
  [data-ide-shell] .ide-story-body code{font:10.5px ui-monospace,Menlo,monospace;background:#232327;padding:0 4px;border-radius:4px;color:#d4d4d8}
</style>

<!-- ============================ DESIGN (Solco window mock) ============================ -->
<style id="design-styles">
  .design-root{position:relative;width:var(--w,1120px);max-width:100%;height:calc(100vh - 54px);min-height:640px;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:38px minmax(0,1fr);
    background:var(--bg);color:var(--i1);border:1px solid var(--hair2);border-radius:12px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .design-root *{box-sizing:border-box}
  .design-root :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
  .design-root .ic{flex:none;display:block}
  .design-root .spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--i4);border-top-color:var(--i2);animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .design-root .shim{background:linear-gradient(90deg,var(--i3) 0%,var(--i1) 50%,var(--i3) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.7s linear infinite}
  @keyframes shim{from{background-position:220% 0}to{background-position:-120% 0}}
  @media (prefers-reduced-motion:reduce){.design-root .spin,.design-root .shim{animation:none}.design-root .shim{color:var(--i2);background:none}}

  /* title bar */
  .design-root .bar{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 12px 0 78px;border-bottom:1px solid var(--hair);font-size:12px;color:var(--i2);position:relative}
  .design-root .bar .lights{position:absolute;left:14px;display:flex;gap:7px}
  .design-root .bar .lights i{width:11px;height:11px;border-radius:50%;background:var(--i4)}
  .design-root .chip{padding:3px 8px;border-radius:7px;color:var(--i2)}
  .design-root .chip.cur{color:var(--i1)}
  .design-root .bar .sep{color:var(--i4)}
  .design-root .bar .tools{margin-left:auto;display:flex;align-items:center;gap:6px}
  .design-root .trig{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:8px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--i2)}
  .design-root .trig:hover{background:var(--tint2);color:var(--i1)}
  .design-root .trig b{font-weight:500;color:var(--i1)}
  .design-root .ibtn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--i2)}
  .design-root .ibtn:hover,.design-root .ibtn.on{background:var(--tint2);color:var(--i1)}

  /* status slot */
  .design-root .slot{width:16px;height:16px;display:grid;place-items:center;flex:none}
  .design-root .ring{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--i3)}
  .design-root .dot{width:7px;height:7px;border-radius:50%}
  .design-root .dot.warn{background:var(--warn)}.design-root .dot.bad{background:var(--bad)}.design-root .dot.ok{background:var(--ok)}

  /* sidebar */
  .design-root .side{border-right:1px solid var(--hair);padding:10px 8px;overflow:auto;font-size:12.5px}
  .design-root .side h6{margin:12px 8px 5px;font-size:11px;font-weight:500;color:var(--i3);letter-spacing:.01em;display:flex;align-items:center;gap:6px}
  .design-root .side h6:first-child{margin-top:2px}
  .design-root .side h6 .pl{margin-left:auto;color:var(--i3)}
  .design-root .prow{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 6px 0 6px;border-radius:8px;color:var(--i2);width:100%}
  .design-root .prow:hover{background:var(--tint)}
  .design-root .prow.sel{background:var(--tint2);color:var(--i1)}
  .design-root .prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .design-root .prow .key{font-size:10.5px;color:var(--i3);font-variant-numeric:tabular-nums}
  .design-root .tile{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none;background:var(--tint2);color:var(--i2)}
  .design-root .chev{color:var(--i3);display:grid;place-items:center;width:12px}
  .design-root .nest{position:relative;margin:1px 0 4px 15px;padding-left:9px;border-left:1px solid var(--hair2)}
  .design-root .srow{display:flex;align-items:center;gap:7px;min-height:26px;padding:0 6px 0 4px;border-radius:7px;color:var(--i2);font-size:12px;width:100%}
  .design-root .srow:hover{background:var(--tint)}
  .design-root .srow.sel{background:var(--tint2);color:var(--i1)}
  .design-root .srow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .design-root .srow .id{font-size:10.5px;color:var(--i3);font-variant-numeric:tabular-nums;flex:none}
  .design-root .arow{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 6px;border-radius:8px;color:var(--i2);font-size:12px}
  .design-root .brand{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:600;flex:none;background:var(--tint2);color:var(--i2)}

  /* main columns */
  .design-root .stage{display:grid;min-width:0;min-height:0;position:relative}
  .design-root .stage.two{grid-template-columns:minmax(0,1fr) 332px}
  .design-root .main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
  .design-root .aside{border-left:1px solid var(--hair);display:flex;flex-direction:column;min-width:0;min-height:0;font-size:12.5px}
  .design-root .log{flex:1;overflow-y:auto;padding:20px 0 10px;min-height:0}
  .design-root .col{max-width:700px;margin:0 auto;padding:0 24px}
  .design-root .uB{margin:0 0 18px auto;width:fit-content;max-width:82%;background:var(--tint2);padding:9px 14px;border-radius:18px;font-size:14px;line-height:1.55}
  .design-root .prose{font-size:14.5px;line-height:1.7;color:var(--i1);margin:0 0 .9em}
  .design-root .prose code,.design-root code.m{font:.86em ui-monospace,"SF Mono",Menlo,monospace;background:var(--tint2);padding:.12em .38em;border-radius:5px}
  .design-root .trow{display:flex;align-items:center;gap:8px;min-height:25px;font-size:13px;color:var(--i2)}
  .design-root .trow .lead{width:14px;display:grid;place-items:center;color:var(--i3);flex:none}
  .design-root .trow .meta{margin-left:auto;color:var(--i3);font-size:12px;font-variant-numeric:tabular-nums}
  .design-root .sum{display:flex;align-items:center;gap:6px;font-size:13px;min-height:26px;color:var(--i2);margin:0 0 12px}
  .design-root .sum .o{color:var(--i3)}
  .design-root .fchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;background:var(--tint2);color:var(--i1);font-size:12px;vertical-align:middle;margin:0 2px}
  .design-root .fchip .x{color:var(--i3);margin-left:2px}
  .design-root .fchip .rd{color:var(--ok);font-size:10.5px;margin-left:3px}
  .design-root .tcard{display:flex;align-items:center;gap:9px;width:100%;min-height:34px;padding:0 12px;margin:0 0 6px;border:1px solid var(--hair2);border-radius:10px;background:var(--panel);font-size:13px;color:var(--i2)}
  .design-root .tcard:hover{border-color:var(--i4);color:var(--i1)}
  .design-root .tcard b{font-weight:500;color:var(--i1);font-variant-numeric:tabular-nums}
  .design-root .tcard .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .design-root .tcard .meta{color:var(--i3);font-size:12px;margin-left:auto;white-space:nowrap}

  /* dock stack */
  .design-root .docks{max-width:700px;width:100%;margin:0 auto;padding:0 24px 8px}
  .design-root .dock{border:1px solid var(--hair2);border-radius:12px;background:var(--panel);margin-top:8px;overflow:hidden}
  .design-root .dock.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--hair2))}
  .design-root .dock .dh{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12.5px;color:var(--i2)}
  .design-root .dock .dh b{font-weight:500;color:var(--i1)}
  .design-root .dock .dh .r{margin-left:auto;color:var(--i3);font-size:11.5px}
  .design-root .dock .db{padding:0 12px 10px;font-size:13px;color:var(--i1)}
  .design-root .opt{display:flex;align-items:center;gap:9px;min-height:32px;padding:0 10px;border-radius:8px;color:var(--i2);width:100%}
  .design-root .opt:hover{background:var(--tint)}
  .design-root .opt .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--i4);display:grid;place-items:center;font-size:10.5px;color:var(--i3);flex:none}
  .design-root .opt.rec .n{border-color:var(--i2);color:var(--i1)}
  .design-root .opt .tag{margin-left:auto;font-size:10.5px;color:var(--i3)}
  .design-root .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .design-root .btn{height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--hair2);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--i1)}
  .design-root .btn:hover{background:var(--tint)}
  .design-root .btn.pri{background:var(--i1);color:var(--bg);border-color:var(--i1)}
  .design-root .btn.pri:hover{opacity:.9}
  .design-root .btn.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--hair2))}
  .design-root .btn.sm{height:24px;padding:0 9px;font-size:12px;border-radius:7px}
  .design-root .steps{margin:0 0 4px;padding:0;list-style:none;font-size:13px;color:var(--i2)}
  .design-root .steps li{display:flex;gap:8px;padding:3px 0}
  .design-root .steps li span:first-child{color:var(--i3);width:14px;font-variant-numeric:tabular-nums}

  /* composer */
  .design-root .compw{max-width:700px;width:100%;margin:0 auto;padding:0 24px 16px}
  .design-root .comp{border:1px solid var(--hair2);border-radius:18px;background:var(--panel);padding:10px 12px 8px}
  .design-root .comp .ph{color:var(--i3);font-size:14px;min-height:22px}
  .design-root .comp .cb{display:flex;align-items:center;gap:4px;margin-top:6px}
  .design-root .comp .sp{flex:1}
  .design-root .comp .cbtn{height:26px;min-width:26px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;color:var(--i2);font-size:12px;justify-content:center}
  .design-root .comp .cbtn:hover{background:var(--tint2);color:var(--i1)}
  .design-root .comp .send{width:28px;height:28px;border-radius:50%;background:var(--i1);color:var(--bg);display:grid;place-items:center}
  .design-root .comp .send.stop{background:var(--tint2);color:var(--i1)}
  .design-root .working{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 10px}
  .design-root .working .t{color:var(--i3);font-variant-numeric:tabular-nums}

  /* aside: tabs + lists */
  .design-root .atabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--hair)}
  .design-root .atab{padding:6px 9px 8px;color:var(--i3);font-size:12.5px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:5px;align-items:center}
  .design-root .atab:hover{color:var(--i1)}
  .design-root .atab.on{color:var(--i1);border-bottom-color:var(--i1)}
  .design-root .atab .c{font-size:10.5px;color:var(--i3);font-variant-numeric:tabular-nums}
  .design-root .abody{flex:1;overflow:auto;padding:10px 10px 12px;min-height:0}
  .design-root .cord{display:flex;align-items:center;gap:8px;min-height:38px;margin:0 0 6px;padding:0 10px;border-radius:10px;background:var(--tint)}
  .design-root .cord .sub{font-size:11px;color:var(--i3)}
  .design-root .gh{display:flex;align-items:center;gap:6px;margin:12px 6px 3px;font-size:11px;color:var(--i3)}
  .design-root .gh .c{font-variant-numeric:tabular-nums}
  .design-root .gh.need{color:var(--warn)}
  .design-root .trw{display:flex;align-items:flex-start;gap:8px;padding:6px 6px;border-radius:8px;width:100%}
  .design-root .trw:hover{background:var(--tint)}
  .design-root .trw.sel{background:var(--tint2)}
  .design-root .trw .slot{margin-top:1px}
  .design-root .trw .tx{flex:1;min-width:0}
  .design-root .trw .t1{display:flex;gap:6px;align-items:baseline;color:var(--i1)}
  .design-root .trw .t1 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .design-root .trw .t1 .id{font-size:10.5px;color:var(--i3);flex:none;font-variant-numeric:tabular-nums}
  .design-root .trw .t2{font-size:11.5px;color:var(--i3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .design-root .trw .t2.warn{color:var(--warn)}
  .design-root .trw .rt{display:flex;gap:4px;color:var(--i3);font-size:10.5px;flex:none;align-items:center}
  .design-root .tag{font-size:10.5px;color:var(--i3);padding:0 5px;border-radius:5px;background:var(--tint);line-height:16px;flex:none}
  .design-root .tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
  .design-root .tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
  .design-root .tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
  .design-root .find{display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;border-radius:8px;border:1px solid var(--hair2);color:var(--i3);margin:0 0 4px;font-size:12px}
  .design-root .foot{padding:8px 10px;border-top:1px solid var(--hair);display:flex;gap:6px;align-items:center}

  /* progress */
  .design-root .pbar{height:3px;border-radius:2px;background:var(--tint2);overflow:hidden}
  .design-root .pbar i{display:block;height:100%;background:var(--i2);border-radius:2px}
  .design-root .pbar.warn i{background:var(--warn)}.design-root .pbar.bad i{background:var(--bad)}

  /* library */

/* ===================== run header + strip ===================== */
function stepsFor(t){
  const plan=t.id==='SLC-11';
  const names=[...(plan?['Plan']:[]),'Work','Check','PR','Review','Approve','Merge'];
  let s;
  if(t.id==='SLC-11')s=['gate','skip','skip','skip','skip','skip','skip'];
  else if(t.id==='SLC-12')s=['done','done','done','done','gate','skip'];
  else if(t.id==='SLC-14')s=['gate','skip','skip','skip','skip','skip'];
  else if(t.id==='SLC-13')s=['cur','skip','skip','skip','skip','skip'];
  else s=names.map(()=> 'skip');
  const sub={ 'SLC-12':[ 'R2 · 12 min','pass','#60','R2 pass · 1 minor','your yes','' ],'SLC-13':['62% · ~6m','','','','',''],'SLC-14':['asks you','','','','',''],'SLC-11':['approve plan','','','','','','']}[t.id]||[];
  return names.map((n,i)=>({n,c:s[i]||'skip',sm:sub[i]||''}));
}
function runStrip(t){
  return `<div class="strip">${stepsFor(t).map(s=>`<div class="stp ${s.c}"><div class="bar2"></div><div class="lb">${s.c==='cur'?'<span class="spin"></span>':s.c==='done'?ic('check',11):s.c==='gate'?'<span class="dot warn"></span>':''}${s.n}</div><div class="sm">${esc(s.sm)}</div></div>`).join('')}</div>`;
}
function runHeader(t){
  const act=t.st==='work'?`<button class="btn sm">${ic('stop',11)}Stop</button>`
    :t.st==='ask'?`<button class="btn sm pri">Answer below</button>`
    :t.st==='plan'?`<button class="btn sm pri">Approve plan</button>`
    :t.st==='ready'?`<button class="btn sm pri">Approve &amp; merge…</button>`:'';
  const l2=t.st==='ask'?`<span class="w">Needs you · Question for you</span>`:t.st==='plan'?`<span class="w">Needs you · Plan to approve</span>`:t.st==='ready'?`<span class="w">Ready · PR#60 · R2 pass</span>`:t.st==='work'?`<span>${esc(t.note)} · ${t.pct}% · ${t.eta} left</span>`:`<span>${esc(t.note)}</span>`;
  return `<div class="rh"><div class="l1">${slot(t.st)}<span class="id">${t.id}</span><h2>${esc(t.t)}</h2><span class="sp"></span>${act}<button class="ibtn" data-act="menu" title="Task actions">${ic('more',16)}</button></div>
    <div class="l2">${l2}<span>·</span>${t.agent?`<span class="brand">${brandOf(t.agent)}</span><span>${t.agent} · ${t.model}</span>`:'<span>no agent yet</span>'}<span>·</span><span>${ic('branch',11)} work/${t.id.slice(4)}-${t.t.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,18)}</span></div>
    ${runStrip(t)}</div>`;
}

/* ===================== task chat ===================== */
function taskLog(t){
  const brief=`${esc(t.t)}. Context: ${fchip('login-flow.png','img',t.st==='work'?2:0)}${fchip('House rules','note')}${fchip('api-contract.pdf','file')}`;
  let body='';
  if(t.st==='work')body=bub(brief)+prose('I opened the login screenshot and the router. The redirect loop comes from <code>afterLogin()</code> reading a stale <code>next</code> param; I am wiring the Library drop target into the same save path now.')+sumrow('Explored 4 files','Edited 2 files <b style="font-weight:500">+38 −6</b>')+workingLine('Editing library_drop.go','3m 12s');
  else if(t.st==='ask')body=bub(brief)+prose('Two places set the redirect: the session cookie and the query param. They disagree after SSO. I can fix either, but they give different behaviour, so I need your call before I change the router.')+sumrow('Explored 7 files','Ran tests: 41 passed');
  else if(t.st==='plan')body=bub(`${esc(t.t)}. Plan first. Context: ${fchip('brand-tokens.json','file')}`)+prose('I read the token JSON and the three Go token files. Nothing is changed yet; the plan is in the card below.')+sumrow('Explored 6 files','no edits');
  else if(t.st==='ready')body=bub(brief)+prose('The header now lives in the Chat page and mirrors the task state. I committed on <code>work/12-task-chat-header</code>, merged main, and the board opened PR#60.')+sumrow('Edited 3 files','Ran tests: 58 passed')
    +`<div class="dock" style="margin:6px 0 14px"><div class="dh">${ic('diff',13)}<b>Changes in working tree</b><span class="r">+112 −34</span></div><div class="db" style="color:var(--i2)">chat_header.go · frontend/src/header.tsx · header.css <div class="btns"><button class="btn sm">${ic('diff',12)}Review changes</button></div></div></div>`;
  else if(t.st==='queue')body=bub(`${esc(t.t)}. After SLC-12.`)+prose('No agent yet. It starts by itself once <b style="font-weight:500">SLC-12</b> is merged, and is told what that task did. <code>delegate --now</code> starts it early.');
  else if(t.st==='todo')body=bub(esc(t.t))+prose('Noted, not started. Say go, or delegate it, and an agent starts in its own worktree.');
  else if(t.st==='done')body=bub(esc(t.t))+prose('Merged as PR#57. The worktree and branch were removed; the transcript and report stay.')+sumrow('Edited 2 files','Ran tests: 52 passed');
  const docks=t.st==='ask'?dockAsk():t.st==='plan'?dockPlan():t.st==='ready'?dockReady():t.st==='work'?dockTasks():'';
  const ph=t.st==='ask'?'Reply to the agent…':(t.st==='todo'||t.st==='queue')?`Say go, or change ${t.id}…`:`Tell ${t.id}…`;
  return `<div class="log"><div class="col">${body}</div></div><div class="docks">${docks}</div>${composer(ph,{stop:t.st==='work'})}`;
}

function mapLife(){
  const X=i=>14+136*i, Y=96, W=108, Hh=58;
  const n=[['To do','','To do','delegate · --now'],['Queued','opt','after SLC-n','after'],['Plan ready','gate opt','you approve','approve · tell'],['Working','','agent in worktree','tell · stop'],['Finish line','','commit·sync·check','retry · fix'],['Pull request','','draft PR','—'],['Review R#n','','2nd agent','review'],['Ready','gate','your yes','approve'],['Merged','end','Done · cleanup','archive']];
  let s=`<svg viewBox="0 0 1250 640" role="img" aria-label="Task lifecycle state machine">${defs}`;
  s+=`<text class="dim lg" x="14" y="24">AUTHORITY: herdr-projects plugin (all transitions). SOLCO: shows states from list/details, sends the verbs under each step.</text>`;
  n.forEach((a,i)=>{s+=node(X(i),Y,W,Hh,a[1],a[0],a[2]);s+=`<text class="vb" x="${X(i)+W/2}" y="${Y+Hh+17}" text-anchor="middle">${a[3]}</text>`;if(i)s+=`<path class="e ${[2,7].includes(i)?'gate':''}" d="M${X(i-1)+W} ${Y+Hh/2}H${X(i)}"/>`});
  // loops
  s+=`<path class="e loop" d="M${X(4)+W/2} ${Y+Hh+28}V${Y+Hh+62}H${X(3)+W/2}V${Y+Hh+28}"/><text class="lg" fill="var(--bad)" x="${X(3)+W+4}" y="${Y+Hh+78}" style="fill:var(--bad)">check fails (3 tries)</text>`;
  s+=`<path class="e loop" d="M${X(6)+W/2} ${Y+Hh+28}V${Y+Hh+100}H${X(3)+W/2-14}V${Y+Hh+28}"/><text class="lg" x="${X(4)+W+10}" y="${Y+Hh+116}" style="fill:var(--bad)">review fails at/above “must fix” · conflict with main · GitHub checks fail</text>`;
  s+=`<path class="e loop" d="M${X(7)+W/2} ${Y+Hh+28}V${Y+Hh+138}H${X(3)+W/2+14}V${Y+Hh+28}"/><text class="lg" x="${X(5)+W+10}" y="${Y+Hh+154}" style="fill:var(--bad)">you send it back · new commits withdraw the approval</text>`;
  // side states below
  const SY=400;
  s+=node(X(3)-10,SY,128,56,'gate','Needs you','question · permission · auth');
  s+=`<path class="e gate" d="M${X(3)+W/2} ${Y+Hh+170}V${SY}" style="marker-end:url(#arw)"/>`;
  s+=node(X(4)+10,SY,128,56,'opt','Provider cut off','retry 1·2·4·8 min');
  s+=node(X(5)+30,SY,128,56,'opt','Limit reached','time / tokens → waits');
  s+=node(X(6)+50,SY,128,56,'opt','Fallback agent','takes over once');
  s+=node(X(7)+70,SY,128,56,'opt','Stopped','work kept · reply resumes');
  s+=`<text class="dim lg" x="${X(3)-10}" y="${SY-10}">any time while Working</text>`;
  // off-ramps
  s+=node(14,SY+86,170,50,'end','Chat-only','never finishes · ends when you say');
  s+=node(204,SY+86,170,50,'end','Research-only','result is a report · no merge');
  s+=node(394,SY+86,170,50,'end','Finish as-is','`finish` · takes the work, no merge');
  s+=node(584,SY+86,170,50,'end','Archive','reversible · agent must be stopped');
  s+=node(774,SY+86,170,50,'bad','Clear','removes task · keeps unsaved work');
  s+=`<text class="dim lg" x="14" y="${SY+78}">off-ramps</text>`;
  // solco owns
  s+=`<rect class="n sol" x="${X(0)}" y="${Y-50}" width="${X(2)+W-X(0)}" height="30" rx="8" fill="none"/><text class="lg" x="${X(0)+8}" y="${Y-30}" style="fill:var(--ok)">Solco: New task sheet (+ Context, Brief preview)</text>`;
  s+=`<rect class="n sol" x="${X(6)}" y="${Y-50}" width="${X(8)+W-X(6)}" height="30" rx="8" fill="none"/><text class="lg" x="${X(6)+8}" y="${Y-30}" style="fill:var(--ok)">Solco: Review tab · Changes card · Approve (shared confirm)</text>`;
  s+='</svg>';
  return `<h2>Lifecycle: one task, start to cleanup</h2><p class="lede">Read from the plugin’s docs (<code>how-work-gets-done</code>, <code>waiting-for-you</code>, <code>plan</code>, <code>after</code>, <code>limits</code>, <code>fallback</code>, <code>provider-errors</code>). Every arrow is the plugin’s; Solco only maps <code>stage / state / kind / msg</code> from <code>list</code> and <code>details</code> to the Run strip and sends the verbs written under each step.</p>${s}
   <div class="legend"><span><i></i>automatic stage</span><span><i class="g"></i>waits for a human</span><span><i class="o"></i>optional / conditional</span><span><i class="b"></i>failure loop / destructive</span><span><i class="s"></i>where Solco’s new UI lives</span></div>`;

  const col=(x,t)=>`<text class="dim lg" x="${x}" y="22">${t}</text>`;
  s+=col(14,'1 · SOURCES')+col(280,'2 · TIER (how often)')+col(560,'3 · DELIVERY (through the plugin)')+col(870,'4 · AGENT READS')+col(1060,'5 · OUTPUTS');
  const src=[['Library','files · images · notes','sol'],['Repo AGENTS.md / CLAUDE.md','yours, in the repo',''],['Plugin instructions','worker · reviewer · coordinator',''],['Description + messages','you or the coordinator',''],['Composer attachments','paste · drop · @path','']];
  src.forEach((a,i)=>{s+=node(14,40+i*86,220,60,a[2],a[0],a[1])});
  const tiers=[['① Always','small · every turn',60],['② Attached','this task only',190],['③ On demand','Library INDEX.md · opened when needed',320]];
  tiers.forEach((a,i)=>{s+=node(280,a[2],240,70,i===0?'gate':'',a[0],a[1])});
  const del=[['Managed block in *.instructions','repo scope, plugin setting',60],['`--desc` / `tell` text with @abs/path','never inlines file bytes',190],['INDEX.md pointer (one line in the block)','agent opens only what it needs',320]];
  del.forEach(a=>{s+=node(560,a[2],270,70,'',a[0],a[1])});
  s+=node(870,120,160,110,'','Agents','coordinator · task · reviewer');
  s+=`<text class="dim lg" x="950" y="212" text-anchor="middle">own file tools · @path images</text>`;
  s+=node(1060,60,170,64,'end','Closing note','task folder (private)');
  s+=node(1060,138,170,64,'end','Report','reports/&lt;repo&gt;/&lt;n&gt;/ + link');
  s+=node(1060,216,170,64,'end','Review evidence','R#n verdict');
  s+=node(1060,294,170,64,'end','PR · artifacts','git, GitHub');
  s+=node(1060,386,170,70,'sol','Reports tab','read via details links · Keep in Library →');
  // edges
  const e=(x1,y1,x2,y2,c='')=>`<path class="e ${c}" d="M${x1} ${y1}C${(x1+x2)/2} ${y1} ${(x1+x2)/2} ${y2} ${x2} ${y2}"/>`;
  s+=e(234,70,280,95)+e(234,156,280,95)+e(234,242,280,95)+e(234,70,280,225)+e(234,242,280,225)+e(234,328,280,225)+e(234,70,280,355)+e(234,414,280,225);
  s+=e(520,95,560,95)+e(520,225,560,225)+e(520,355,560,355);
  s+=e(830,95,870,160)+e(830,225,870,175)+e(830,355,870,190);
  s+=e(1030,175,1060,92)+e(1030,175,1060,170)+e(1030,175,1060,248)+e(1030,175,1060,326);
  s+=`<path class="e" d="M1145 358V386"/><path class="e dot" d="M1060 421C960 421 560 480 246 480C150 480 124 300 124 160" style="marker-end:url(#ar)"/><text class="lg dim" x="560" y="500" text-anchor="middle">“Keep in Library” (user action) closes the loop: a report becomes reference for the next task</text>`;
  s+=`<text class="lg" x="14" y="${40+5*86+10}" style="fill:var(--warn)">Freshness: a task freezes at start; the coordinator hears changes at its next message → Library changes after start reach a running task only through “Tell”.</text>`;
  s+='</svg>';
  return `<h2>Context pipeline: in → tier → delivery → read → out</h2><p class="lede">Three tiers instead of one pile: <b style="font-weight:500">Always</b> (short, sent every turn), <b style="font-weight:500">Attached</b> (named for one task), <b style="font-weight:500">On demand</b> (indexed; the agent opens a file only when the work needs it). Content is never inlined into prompts: only absolute paths travel, the way every provider already treats <code>@path</code>.</p>${s}`;
}
function mapControls(){
  const r=[
   ['Talk','Chat composer, ↵','direct prompt; else <code>tell</code> / <code>coordinator tell</code>','steers mid-turn; starts a stopped agent','—','none'],
   ['Start','Launch sheet → Create &amp; start','<code>add --desc … --delegate</code>','worktree + agent','Stop','none'],
   ['Start later','Launch sheet → Create','<code>add</code>','To do (agent waits for “go”)','Clear','none'],
   ['Plan first','Start = Plan first','<code>--plan.approve you</code>','agent writes a plan, repo untouched','—','none'],
   ['Approve plan','Plan card','<code>approve &lt;id&gt;</code> (stage plan)','build begins','Send back','light'],
   ['Send plan back','Plan card','<code>tell &lt;id&gt; "…"</code>','agent revises','—','none'],
   ['Queue','After picker','<code>add --after</code> · <code>after</code>','starts by itself when they are done','<code>after --clear</code>','none'],
   ['Start now','⋯','<code>delegate &lt;id&gt; --now</code>','skips the wait','Stop','none'],
   ['Stop','Header Stop · Esc','<code>stop &lt;id&gt;</code>','interrupts, keeps work, ends what it started','just reply','light, lists processes'],
   ['Change brief','⋯ Edit description','<code>describe &lt;id&gt;</code> (+ offer to Tell)','replaces text; agent is not told by itself','Edit again','none'],
   ['Change settings','Settings tab','<code>set &lt;k&gt; &lt;v&gt; --task</code>','counts from the next start (shown)','<code>unset</code>','none'],
   ['Send findings back','Review tab','<code>review &lt;id&gt;</code> · <code>retry</code> · <code>fix</code>','agent works again','—','none'],
   ['Approve &amp; merge','Ready card','<code>approve &lt;id&gt;</code>, re-read first, never <code>--anyway</code>','merges PR','irreversible','shared confirm'],
   ['Finish as-is','⋯ (chat / stuck)','<code>finish &lt;id&gt;</code>','done, nothing merged','—','confirm'],
   ['Limits','Settings tab','<code>set limit.time|tokens … --task</code>','stops the agent at the limit','raise it','none'],
   ['Archive','⋯','<code>archive &lt;id&gt;</code>','leaves lists; refused while an agent runs','<code>restore</code>','none'],
   ['Clear','⋯','<code>clear &lt;id&gt;</code>','removes task; unsaved work kept on disk','no','destructive confirm'],
   ['Stop everything','Project ⋯','composed: <code>coordinator stop</code> + each <code>stop</code> + automations off','pause-like (not atomic; failures listed)','start again by hand','counted confirm'],
  ];
  return `<h2>Controls: every verb the UI sends</h2><p class="lede">Nothing here is Solco’s own state change. Each row is one plugin verb run as the human (no pane identity). Refusals come back as the plugin’s own words in a bounded toast.</p>
  <table class="mx"><thead><tr><th>Action</th><th>Where</th><th>Plugin verb</th><th>Effect</th><th>Undo</th><th>Confirm</th></tr></thead><tbody>${r.map(a=>`<tr>${a.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function mapTui(){
  const r=[
   ['List grouped by state, marks, filters','native (/project, sidebar)','keep; add Run strip + Library tab','—'],
   ['Chat box → coordinator / task agent','plain message box (write-only relay)','<b style="font-weight:500">Chat View bound to the agent</b> (transcript, docks, composer, @ and /)','—'],
   ['Task panel: Status · Needs · Reviews · Settings','static /task page','Run · Context · Changes · Review · Settings tabs','—'],
   ['Reply to a question / permission / plan','—','Question dock · Plan card (existing chat docks)','auth prompts → Open Terminal'],
   ['Pasted pictures `[Image n]`, files `@path`','—','composer attachments (ChatAttachments) + Library','cross-machine file carry'],
   ['`/` skills list','—','existing composer picker (Claude Code · Codex · pi · omp)','other 14 agents → Terminal'],
   ['Approve · send back · retry · stop · archive','native actions','keep (shared confirm)','—'],
   ['Automations · Autopilot · Settings','native (Project page, /settings/workboard)','keep','—'],
   ['Other machines, voice, web board, keys','—','—','stays TUI / plugin'],
  ];
  return `<h2>TUI → native parity</h2><p class="lede">The Native | Board switch stays: Board remains the fallback until this table has no “—” in the middle column, then the default flips (the same release rule as 2026-10-26).</p>
  <table class="mx"><thead><tr><th>TUI capability</th><th>Today (native)</th><th>After this design</th><th>Stays outside</th></tr></thead><tbody>${r.map(a=>`<tr>${a.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function mapsView(){
  const f={life:mapLife,layers:mapLayers,context:mapContext,controls:mapControls,tui:mapTui}[S.scene||'life'];
  return `<div class="bar"><span class="lights"><i></i><i></i><i></i></span><span class="chip">Projects</span><span class="sep">${ic('chev',12)}</span><span class="chip cur">Maps</span></div><div class="mapbody">${f()}</div>`;
}

/* ===================== scene router ===================== */
const VARIANTS={
 A:{title:'A · Coordinator-first',desc:'Home = a Chat View with the project’s coordinator; the right pane is the project Overview (Tasks · Library · Reports · Auto). Same shape as Cursor Projects and Claude Projects.',
    scenes:[['home','Home · coordinator chat'],['library','Library tab (context in)'],['task','Task · running'],['ask','Task · needs you'],['plan','Task · plan to approve'],['ready','Task · ready to approve'],['launch','New task + brief preview'],['control','Stop · modify · remove'],['empty','New project (empty)']]},
 B:{title:'B · Board-first',desc:'Home = status columns for scanning many tasks; Library is a shelf on top; the coordinator is a bottom bar that opens a chat tray. Closest to the TUI board.',
    scenes:[['board','Home · board'],['tray','Coordinator tray open'],['task','Task (same run view)'],['library','Library sheet'],['launch','New task sheet']]},
 C:{title:'C · Inbox + run',desc:'No project home page: a two-pane Runs page. Left = this project’s attention-ordered list (coordinator is its first row); right = the selected run with a Details drawer.',
    scenes:[['inbox','Runs · inbox + run'],['ask','Needs you'],['drawer','Details drawer open'],['library','Library sheet'],['launch','New task sheet']]},
 M:{title:'Maps · flows',desc:'Lifecycle, ownership layers, context pipeline, controls matrix, TUI parity. Not a design alternative: the evidence the options share.',
    scenes:[['life','Lifecycle (state machine)'],['layers','Layers & ownership'],['context','Context pipeline'],['controls','Controls matrix'],['tui','TUI → native parity']]},
};
const STATES={library:[['default','Default'],['drag','Dragging files over'],['added','Added while a task runs'],['over','Always-read over budget'],['refused','Credentials file refused']]};
const STORY={
 A:`<h1>A · Coordinator-first</h1><p><b>Bet:</b> you mostly talk; the board is a sidebar to the conversation.</p><ul><li>Replaces the TUI’s message box with a real Chat View (coordinator and every task agent are ordinary Herdr agents).</li><li>Overview pane = the existing /project list + Library + Reports + Auto.</li><li>Cost: the right pane is narrow for scanning 30+ tasks.</li></ul>`,
 B:`<h1>B · Board-first</h1><p><b>Bet:</b> you mostly scan and triage; talking is occasional.</p><ul><li>Columns scale to many tasks and read like the TUI.</li><li>Coordinator chat is a tray: cheap to open, easy to ignore.</li><li>Cost: statuses are a priority list in the plugin, not a pipeline; columns imply movement that is not drag-and-drop.</li></ul>`,
 C:`<h1>C · Inbox + run</h1><p><b>Bet:</b> you work an attention queue, one run at a time.</p><ul><li>Strongest triage flow; the Header popover grows into this page.</li><li>Cost: weak “project as a container” feel; Library has no home except a footer button.</li></ul>`,
 M:`<h1>Maps</h1><p>All five pages are evidence from the plugin’s docs and the local code. The Controls table is the complete write surface; nothing outside it changes plugin state.</p>`,
};
function sceneOf(){const vs=VARIANTS[S.v].scenes;return vs.some(a=>a[0]===S.scene)?S.scene:vs[0][0]}

const HOME={A:'home',B:'board',C:'inbox',M:'life'};
const TASK_SCENE={task:'SLC-13',ask:'SLC-14',plan:'SLC-11',ready:'SLC-12',control:'SLC-13'};
function librarySheet(){return `<div class="scrim" data-act="close"><div class="modal" data-stop="1" style="grid-template-columns:1fr;width:min(520px,100%)"><div class="mf" style="padding:14px 14px 16px">${libraryView()}</div></div></div>`}
function render(){
  const root=$('#root');applyVars(root);const sc=sceneOf();S.scene=sc;
  root.className='design-root'+(S.v==='M'?' maps':'');
  let h='';
  if(S.v==='M'){h=mapsView()}
  else{
    const taskScene=S.v==='A'&&TASK_SCENE[sc];
    const sel=S.task||(S.v==='A'?(TASK_SCENE[sc]||''):S.v==='B'?(sc==='task'||sc==='control'?'SLC-13':''):(sc==='ask'?'SLC-14':sc==='drawer'?'SLC-12':sc==='inbox'||sc==='launch'||sc==='library'?'SLC-13':''));
    const t=sel?taskById(sel):null;
    let stage='';
    if(S.v==='A'){
      if(sc==='home'||sc==='launch'){if(sc==='home')S.atab=S.atab==='library'?'tasks':S.atab;stage=homeA()}
      else if(sc==='library'){S.atab='library';stage=homeA()}
      else if(sc==='empty')stage=emptyA();
      else stage=taskPage(t||taskById('SLC-13'));
    }else if(S.v==='B'){
      if(sc==='task'||sc==='control')stage=taskPage(t||taskById('SLC-13'));
      else stage=homeB(sc==='tray');
    }else{
      if(sc==='drawer')S.inspOpen=true;else if(sc==='inbox'||sc==='ask')S.inspOpen=false;
      stage=homeC(t?t.id:'SLC-13');
    }
    let over='';
    if(sc==='launch')over=launchSheet();
    if(sc==='library'&&S.v!=='A')over=librarySheet();
    const inTask=!!(t&&(S.v==='A'?(taskScene||S.task):S.v==='B'?(sc==='task'||sc==='control'):true));
    if(S.menu&&sc!=='control')over+=inTask?taskMenu(t):projMenu();
    if(sc==='control')over+=taskMenu(taskById('SLC-13'))+stopToast();
    const crumbs=['Projects','solco'].concat(inTask?[t.id]:[]);
    h=bar(crumbs)+sidebar(inTask?t.id:'')+stage+over;
  }
  root.innerHTML=h;
  $('#stageLabel').textContent=VARIANTS[S.v].title+' · '+(VARIANTS[S.v].scenes.find(a=>a[0]===sc)||[,''])[1];
  renderPanel();
  history.replaceState(null,'',`#v=${S.v}&scene=${sc}&theme=${S.theme}&w=${S.w}`);
}

/* ===================== storybook panel ===================== */
function seg(label,key,opts){return `<div class="ctl"><span>${label}</span><div class="shell-seg">${opts.map(([v,l])=>`<button data-ctl="${key}" data-val="${v}" class="${String(S[key])===String(v)?'on':''}">${l}</button>`).join('')}</div></div>`}
function renderPanel(){
  const sc=S.scene;
  $('#panelControls').innerHTML=`<div class="ide-section-title">Variants</div>${Object.entries(VARIANTS).map(([id,c])=>`<div class="ide-variant-card ${id===S.v?'active':''}" data-v="${id}"><h2>${c.title}</h2><p>${c.desc}</p></div>`).join('')}
   <div class="ide-section-title">Scenes</div>${VARIANTS[S.v].scenes.map(([k,l])=>`<div class="ide-state-card ${k===sc?'active':''}" data-scene="${k}"><strong>${l}</strong></div>`).join('')}
   ${S.v==='A'&&sc==='library'?`<div class="ide-section-title">Library state</div>${STATES.library.map(([k,l])=>`<div class="ide-state-card ${S.lstate===k?'active':''}" data-lstate="${k}"><strong>${l}</strong></div>`).join('')}`:''}
   <div class="ide-section-title">Controls</div>${seg('Theme','theme',[['dark','Dark'],['light','Light']])}${seg('Window','w',[[1120,'1120'],[900,'900'],[1320,'1320']])}`;
  $('#storyBody').innerHTML=STORY[S.v];
}

/* ===================== events ===================== */
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-v],[data-scene],[data-lstate],[data-ctl]');
  if(p&&p.closest('.ide-story-panel')){
    if(p.dataset.v){S.v=p.dataset.v;S.scene='';S.task='';S.menu=false;S.atab='tasks';S.lstate='default'}
    else if(p.dataset.scene!==undefined){S.scene=p.dataset.scene;S.task='';S.menu=false;if(S.scene!=='library')S.atab='tasks'}
    else if(p.dataset.lstate){S.lstate=p.dataset.lstate}
    else if(p.dataset.ctl){S[p.dataset.ctl]=p.dataset.ctl==='w'?+p.dataset.val:p.dataset.val}
    render();return;
  }
  const a=e.target.closest('#root [data-act]');
  if(!a){if(S.menu){S.menu=false;render()}return}
  const act=a.dataset.act;
  if(act==='close'){if(e.target.closest('.modal')&&!e.target.closest('button[data-act=close]'))return;S.scene=HOME[S.v];render();return}
  if(act==='task'){const id=a.dataset.id;const t=taskById(id);S.task=id;S.menu=false;
    S.scene=S.v==='A'?({ask:'ask',plan:'plan',ready:'ready'}[t.st]||'task'):S.v==='B'?'task':'inbox';
    S.insp=t.st==='ready'?'rev':t.st==='work'||t.st==='ask'||t.st==='plan'?'run':'run';render();return}
  if(act==='home'){S.task='';S.menu=false;S.scene=HOME[S.v];S.atab='tasks';render();return}
  if(act==='tab'){S.menu=false;S.task='';if(a.dataset.tab==='library'){S.atab='library';S.scene='library'}else{S.atab=a.dataset.tab;S.scene=S.v==='A'?'home':HOME[S.v]}render();return}
  if(act==='insp'){S.insp=a.dataset.k;render();return}
  if(act==='menu'){S.menu=!S.menu;render();return}
  if(act==='pmenu'){S.menu=!S.menu;render();return}
  if(act==='launch'){S.menu=false;S.scene='launch';render();return}
  if(act==='tray'){S.scene=S.scene==='tray'?'board':'tray';render();return}
  if(act==='item'){S.openItem=S.openItem===a.dataset.n?'':a.dataset.n;render();return}
  if(act==='seg'){S[a.dataset.key]=a.dataset.val;render();return}
});
$('#panelCollapseBtn').addEventListener('click',()=>$('#ideLayout').classList.add('panel-collapsed'));
$('#panelExpandBtn').addEventListener('click',()=>$('#ideLayout').classList.remove('panel-collapsed'));
$('#storyToggleBtn').addEventListener('click',()=>{const c=$('#ideLayout').classList.toggle('story-collapsed');$('#storyChevron').textContent=c?'▶':'▼'});
document.addEventListener('keydown',e=>{  if(e.key==='Escape'){if(S.menu){S.menu=false;render()}else if(S.scene==='launch'||(S.scene==='library'&&S.v!=='A')){S.scene=HOME[S.v];render()}else $('#ideLayout').classList.add('panel-collapsed')}});
render();
</script>
</body>
