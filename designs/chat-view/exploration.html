<!DOCTYPE html>
<!--
  Solco · Chat View —— Design Storybook（think → interactive-design-exploration）

  直接用浏览器打开（file://），无外部依赖、无构建。
  Tokens 来自真实实现：frontend/src/theme.css（--content/--panel/--text/--text-muted 深浅两套）、
  design_system.go（Radius Control 6 / Row 8 / Card 10 / Pill 999；无投影、hairline 边）、
  components.go dockPanel（Composer：hairline 边、聚焦增亮）、status_indicator.go（working=转圈 / idle=空心环 / 其余=实心点）。
  数据结构对齐 internal/nativeui/chat_bridge.go：turn.steps[kind=thinking|text|tool]、live、failed、interactions、model、contextTokens。
  URL hash 可预置状态：#v=B&scene=live&theme=light&w=560&font=serif&ink=high
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solco · Chat View</title>
<!-- ============================ SHELL (Design Storybook) ============================ -->
<style>
  [data-ide-shell]{--shell-bg:#0f0f10;--shell-panel:#18181b;--shell-border:#27272a;--shell-text:#fafafa;--shell-muted:#a1a1aa;--shell-accent:#71717a;--panel-w:324px;
    box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--shell-bg);color:var(--shell-text);min-height:100vh;margin:0}
  [data-ide-shell] *{box-sizing:border-box}
  [data-ide-shell] .ide-layout{display:flex;min-height:100vh}
  [data-ide-shell] .ide-stage{flex:1;position:relative;display:flex;flex-direction:column;min-height:100vh;min-width:0;background:#0b0b0c}
  [data-ide-shell] .ide-stage-label{position:absolute;top:12px;left:14px;z-index:20;font-size:9px;font-weight:600;color:var(--shell-accent);text-transform:uppercase;letter-spacing:.06em;pointer-events:none}
  [data-ide-shell] .ide-panel-collapse-btn{position:absolute;top:10px;right:10px;z-index:30;width:28px;height:28px;border-radius:6px;border:1px solid var(--shell-border);background:var(--shell-panel);color:var(--shell-muted);cursor:pointer;font-size:12px}
  [data-ide-shell] .ide-artboard-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:34px 24px 14px}
  [data-ide-shell] .ide-artboard{width:100%;display:flex;justify-content:center}
  [data-ide-shell] .ide-story-panel{width:var(--panel-w);flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--shell-border);background:var(--shell-panel);transition:width .2s;overflow:hidden;height:100vh;position:sticky;top:0}
  [data-ide-shell] .ide-layout.panel-collapsed .ide-story-panel{width:0;border-left:none}
  [data-ide-shell] .ide-panel-expand-btn{display:none;position:fixed;top:10px;right:10px;z-index:40;width:28px;height:28px;border-radius:6px;border:1px solid var(--shell-border);background:var(--shell-panel);color:var(--shell-muted);cursor:pointer;font-size:12px}
  [data-ide-shell] .ide-layout.panel-collapsed .ide-panel-expand-btn{display:grid;place-items:center}
  [data-ide-shell] .ide-panel-header{padding:12px 14px 8px;border-bottom:1px solid var(--shell-border);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--shell-muted);white-space:nowrap}
  [data-ide-shell] .ide-panel-controls{flex:1;overflow-y:auto;padding:12px 14px;min-height:0}
  [data-ide-shell] .ide-section-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--shell-accent);margin:0 0 6px}
  [data-ide-shell] .ide-section-title:not(:first-child){margin-top:14px}
  [data-ide-shell] .ide-variant-card,[data-ide-shell] .ide-state-card{padding:8px 10px;border-radius:6px;border:1px solid var(--shell-border);margin-bottom:5px;cursor:pointer;transition:border-color .12s,background .12s}
  [data-ide-shell] .ide-variant-card:hover,[data-ide-shell] .ide-state-card:hover{border-color:#3f3f46}
  [data-ide-shell] .ide-variant-card.active,[data-ide-shell] .ide-state-card.active{border-color:var(--shell-accent);background:rgba(113,113,122,.1)}
  [data-ide-shell] .ide-variant-card h2{font-size:11px;font-weight:600;margin:0 0 2px}
  [data-ide-shell] .ide-variant-card p{margin:0;color:var(--shell-muted);font-size:10px;line-height:1.4}
  [data-ide-shell] .ide-state-card{font-size:10px;line-height:1.4;color:var(--shell-muted)}
  [data-ide-shell] .ide-state-card strong{display:block;color:var(--shell-text);font-size:10.5px}
  [data-ide-shell] .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px;font-size:10.5px;color:var(--shell-muted)}
  [data-ide-shell] .shell-seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--shell-border);border-radius:7px;flex-wrap:wrap;justify-content:flex-end}
  [data-ide-shell] .shell-seg button{all:unset;cursor:pointer;padding:3px 8px;border-radius:5px;font-size:10px;color:var(--shell-muted)}
  [data-ide-shell] .shell-seg button.on{background:#2c2c31;color:var(--shell-text)}
  [data-ide-shell] .ratio{font:10px ui-monospace,Menlo,monospace;color:var(--shell-muted);margin:2px 0 0;line-height:1.7}
  [data-ide-shell] .ratio b{color:var(--shell-text);font-weight:500}
  [data-ide-shell] .ratio .ok{color:#6fc29b}[data-ide-shell] .ratio .no{color:#ff6b61}
  [data-ide-shell] .ide-panel-story{border-top:1px solid var(--shell-border);flex-shrink:0}
  [data-ide-shell] .ide-story-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:none;background:rgba(255,255,255,.02);color:var(--shell-muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
  [data-ide-shell] .ide-story-toggle:hover{color:var(--shell-text);background:rgba(255,255,255,.04)}
  [data-ide-shell] .ide-story-body{padding:0 14px 14px;font-size:11px;line-height:1.55;color:var(--shell-muted);max-height:236px;overflow-y:auto}
  [data-ide-shell] .ide-layout.story-collapsed .ide-story-body{display:none}
  [data-ide-shell] .ide-story-body h1{font-size:13px;font-weight:600;color:var(--shell-text);margin:0 0 6px}
  [data-ide-shell] .ide-story-body p{margin:0 0 8px}
  [data-ide-shell] .ide-story-body ul{margin:0 0 8px;padding-left:16px}
  [data-ide-shell] .ide-story-body li{margin-bottom:4px}
  [data-ide-shell] .ide-story-body b{color:var(--shell-text);font-weight:600}
  [data-ide-shell] .ide-story-body code{font:10.5px ui-monospace,Menlo,monospace;background:#232327;padding:0 4px;border-radius:4px;color:#d4d4d8}
  #spec{position:fixed;z-index:99;pointer-events:none;background:#fafafa;color:#18181b;font:11px/1.45 ui-monospace,Menlo,monospace;padding:5px 8px;border-radius:6px;display:none;max-width:320px;white-space:pre}
</style>

<!-- ============================ DESIGN (Solco Chat WebView) ============================ -->
<style id="design-styles">
  .design-root{--w:760px;position:relative;width:var(--w);max-width:100%;height:calc(100vh - 54px);min-height:560px;display:flex;flex-direction:column;
    background:var(--bg);color:var(--i1);border:1px solid var(--hair);border-radius:12px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;font-size:13px;line-height:1.4;
    -webkit-font-smoothing:var(--smooth,antialiased);text-rendering:optimizeLegibility}
  .design-root *{box-sizing:border-box}
  .design-root :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
  .design-root.noauto .prose{text-autospace:no-autospace}
  .design-root:not(.noauto) .prose,.design-root:not(.noauto) .bub,.design-root:not(.noauto) .uB,.design-root:not(.noauto) .think{text-autospace:ideograph-alpha ideograph-numeric}

  /* ---- type scale: per-variant defaults, overridden by the Type lab ---- */
  .design-root.vA{--fs-d:15px;--lh-d:1.72;--col:748px;--bub:18px}
  .design-root.vB{--fs-d:14px;--lh-d:1.68;--col:820px}
  .design-root.vC{--fs-d:13.5px;--lh-d:1.62;--col:860px}
  .design-root .prose{font-family:var(--ff-prose,inherit);font-size:var(--fs,var(--fs-d));line-height:var(--lh,var(--lh-d));font-weight:var(--fw,400);color:var(--i1);overflow-wrap:anywhere}
  .turn>.prose{margin-bottom:.9em}.turn>.prose:last-child{margin-bottom:0}
  .prose p{margin:0 0 .85em}.prose p:last-child{margin-bottom:0}
  .prose ul,.prose ol{margin:0 0 .85em;padding-left:1.4em}.prose li{margin:.28em 0}.prose li::marker{color:var(--i3)}
  .prose strong{font-weight:600}
  .prose h4{font-size:1em;font-weight:600;margin:1.15em 0 .4em;letter-spacing:0}
  .prose code{font:.86em ui-monospace,"SF Mono",Menlo,monospace;background:var(--tint2);padding:.12em .38em;border-radius:5px}
  .prose table{border-collapse:collapse;margin:.2em 0 .9em;font-size:.92em;font-variant-numeric:tabular-nums}
  .prose th{font-weight:500;color:var(--i2);text-align:left;padding:5px 18px 5px 0;border-bottom:1px solid var(--hair2)}
  .prose td{padding:5px 18px 5px 0;border-bottom:1px solid var(--hair)}
  .prose td code{background:none;padding:0}
  .prose a{color:var(--link);text-decoration:none}
  .codeb{position:relative;margin:.2em 0 .95em;border-radius:10px;background:var(--tint);border:1px solid var(--hair);overflow:hidden}
  .codeb .ch{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0 14px;font-size:11.5px;color:var(--i3);font-family:-apple-system,"SF Pro Text",sans-serif}
  .codeb pre{margin:0;padding:6px 14px 12px;overflow-x:auto;font:.84em/1.62 ui-monospace,"SF Mono",Menlo,monospace;color:var(--i1);tab-size:4}
  .codeb .cp{opacity:0;transition:opacity .12s}.codeb:hover .cp{opacity:1}
  .k{color:var(--c-k)}.s{color:var(--c-s)}.c{color:var(--i3);font-style:italic}.f{color:var(--c-f)}.n{color:var(--c-n)}

  /* ---- chrome ---- */
  .band{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--hair);font-size:12px;color:var(--i2)}
  .band .sep{color:var(--i4)}.band .ro{margin-left:auto;color:var(--i3)}
  .log{flex:1;overflow-y:auto;padding:22px 0 14px;min-height:0}
  .col{max-width:var(--col);margin:0 auto;padding:0 24px}
  .older{display:block;margin:0 auto 18px;font-size:12px;color:var(--i3);padding:3px 12px;border:1px solid var(--hair);border-radius:999px}
  .older:hover{color:var(--i1);background:var(--tint)}
  .ic{flex:none;display:block}
  .spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--i4);border-top-color:var(--i2);animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .shim{background:linear-gradient(90deg,var(--i3) 0%,var(--i1) 50%,var(--i3) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.7s linear infinite}
  @keyframes shim{from{background-position:220% 0}to{background-position:-120% 0}}
  .prose.caret>:last-child::after{content:"";display:inline-block;width:.46em;height:.46em;border-radius:50%;background:var(--i1);margin-left:.4em;vertical-align:.04em;animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.spin,.shim,.prose.caret>:last-child::after{animation:none}.shim{color:var(--i2);background:none}}

  /* ---- process rows (shared) ---- */
  .trow{display:flex;align-items:center;gap:8px;min-height:25px;font-size:13px;color:var(--i2);line-height:1.4;border-radius:6px}
  .trow .lead{width:14px;display:grid;place-items:center;color:var(--i3);flex:none}
  .trow .verb{color:var(--i2);flex:none}
  .trow .q{color:var(--i3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .path{color:var(--i3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .path b{font-weight:500;color:var(--i1)}
  .cmd{font:12.5px ui-monospace,"SF Mono",Menlo,monospace;color:var(--i1);background:var(--tint2);padding:1px 7px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .trow .meta{margin-left:auto;padding-left:12px;color:var(--i3);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .trow .meta.ok{color:var(--ok)}.trow .meta.err{color:var(--bad)}
  .trow.err .verb{color:var(--bad)}
  .delta{margin-left:auto;padding-left:12px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .delta i{font-style:normal;margin-left:7px}.add{color:var(--ok)}.del{color:var(--bad)}
  .think{color:var(--i2);font-size:13px;line-height:1.65;margin:2px 0 8px;max-width:62ch}
  .v{color:var(--i2)}.o{color:var(--i3)}
  .chev{transition:transform .15s;color:var(--i3)}.open>.chev,.open .chev.cv{transform:rotate(90deg)}
  .mention{font:.88em ui-monospace,"SF Mono",Menlo,monospace;background:var(--tint2);padding:.08em .42em;border-radius:5px}
  .ib{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--i3);flex:none}
  .ib:hover{background:var(--tint);color:var(--i1)}
  .stopped{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--bad);font-size:13px}
  .foot{display:flex;align-items:center;gap:2px;margin-top:6px;height:26px;color:var(--i3);font-size:12px;opacity:0;transition:opacity .12s}
  .turn:hover .foot,.turn.last .foot,.foot:focus-within{opacity:1}
  .foot .t{padding:0 8px 0 0;font-variant-numeric:tabular-nums}
  .foot .ib{font-size:11px}.foot .copied{color:var(--ok)}

  /* ---- composer (shared markup, three skins) ---- */
  .dock{flex:none;padding:6px 0 14px}
  .cmp{position:relative;background:var(--panel);border:1px solid var(--hair2);transition:border-color .15s}
  .cmp:focus-within{border-color:var(--hair3)}
  .cmp textarea{display:block;width:100%;min-height:24px;max-height:200px;resize:none;border:0;outline:0;background:none;color:var(--i1);font:inherit;font-size:14px;line-height:1.55;padding:0}
  .cmp textarea::placeholder{color:var(--i4)}
  .cbar{display:flex;align-items:center;gap:4px}.cbar .sp{flex:1}
  .chip{font-size:12px;color:var(--i2);padding:3px 8px;border-radius:999px;white-space:nowrap}
  .chip:hover{background:var(--tint)}
  .chip.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px}
  .send{width:30px;height:30px;border-radius:50%;background:var(--i1);color:var(--bg);display:grid;place-items:center;flex:none;transition:opacity .12s}
  .send[disabled]{opacity:.22;cursor:default}
  .send.stop{display:grid}.send.queue{display:none}
  .cmp.typed .send.stop{display:none}.cmp.typed .send.queue{display:grid}
  .cmp .intr{display:none;font-size:12px;color:var(--i2);padding:4px 9px;border-radius:999px;border:1px solid var(--hair2)}
  .cmp.typed .intr{display:inline-block}.intr:hover{color:var(--bad);border-color:var(--bad)}
  .hint{margin:6px 4px 0;font-size:12px;color:var(--i3);min-height:16px;display:flex;justify-content:space-between;gap:10px}
  .ring{display:grid;place-items:center;width:20px;height:20px}
  .ask{margin:0 0 8px;border:1px solid var(--hair2);border-radius:14px;background:var(--panel);padding:12px 14px}
  .ask .ah{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px;font-weight:500}
  .ask .pill{font-size:11px;font-weight:400;color:var(--i2);background:var(--tint2);padding:1px 8px;border-radius:999px}
  .ask .opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--i1)}
  .ask .opt:hover{background:var(--tint)}
  .ask kbd{font:11px ui-monospace,Menlo,monospace;color:var(--i3);border:1px solid var(--hair2);border-radius:5px;padding:0 5px;min-width:18px;text-align:center}

  /* ===================== A · Prose (ChatGPT) ===================== */
  .vA .u{display:flex;justify-content:flex-end;margin:0 0 22px}
  .vA .bub{max-width:82%;background:var(--tint2);padding:9px 16px;border-radius:var(--bub);font-size:var(--fs,var(--fs-d));line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere}
  .vA .turn{margin:0 0 26px}
  .vA .run{margin:0 0 .9em}
  .vA .runbtn{display:inline-flex;align-items:center;gap:6px;color:var(--i2);font-size:13.5px;line-height:1.5;padding:2px 0}
  .vA .runbtn:hover,.vA .runbtn:hover .v{color:var(--i1)}
  .vA .runbody{margin:6px 0 4px 6px;padding-left:14px;border-left:1px solid var(--hair2);display:flex;flex-direction:column;gap:1px}
  .vA .dock .col{padding-top:0}
  .vA .cmp{border-radius:24px;padding:14px 12px 10px 18px}
  .vA .cbar{margin-top:8px}
  .vA .cmp textarea{font-size:15px}

  /* ===================== B · Work ledger (Codex / Cursor) ===================== */
  .vB .uB{border:1px solid var(--hair);background:var(--tint);border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:var(--fs,var(--fs-d));line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere}
  .vB .turn{margin:0 0 30px}
  .vB .work{display:flex;align-items:center;gap:10px;width:100%;color:var(--i3);font-size:12.5px;margin:2px 0 8px}
  .vB .work .line{flex:1;height:1px;background:var(--hair)}
  .vB .work:hover{color:var(--i2)}
  .vB .work .lbl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .vB .ledger{border:1px solid var(--hair);border-radius:10px;padding:5px;margin:0 0 14px}
  .vB .ledger .trow{padding:0 8px}.vB .ledger .trow:hover{background:var(--tint)}
  .vB .ledger .think{padding:4px 8px 0}
  .vB .changes{border:1px solid var(--hair);border-radius:10px;overflow:hidden;margin:14px 0 0}
  .vB .chead{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;background:var(--tint);font-size:13px}
  .vB .chead .ttl{display:inline-flex;align-items:center;gap:8px}
  .vB .chead .delta{margin-left:0;padding-left:0}
  .vB .rev{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--hair2);font-size:12.5px;color:var(--i1)}
  .vB .rev:hover{background:var(--tint2)}
  .vB .crow{display:flex;align-items:center;padding:6px 12px;border-top:1px solid var(--hair);font-size:13px}
  .vB .cmp{border-radius:14px;padding:12px 12px 8px 14px}
  .vB .cbar{margin-top:6px}
  .vB .live-tag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i2);margin:0 0 8px;font-variant-numeric:tabular-nums}

  /* ===================== C · Rail / blocks (agent supervision) ===================== */
  .vC .log{padding-top:0}
  .vC .blk{margin:0 0 6px;border-bottom:1px solid var(--hair);padding-bottom:16px}
  .vC .bh{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0 9px;margin:0 0 6px;border-bottom:1px solid transparent}
  .vC .bh.stuck{border-bottom-color:var(--hair)}
  .vC .bh .slot{width:16px;height:16px;display:grid;place-items:center;flex:none}
  .vC .bh .pt{flex:1;min-width:0;font-size:13.5px;font-weight:500;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vC .bh.expand .pt{white-space:normal}
  .vC .bh .tm{font-size:12px;color:var(--i3);font-variant-numeric:tabular-nums;flex:none}
  .vC .rail{position:relative;padding-left:26px}
  .vC .rail::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--hair2)}
  .vC .it{position:relative;padding:2px 0}
  .vC .it .node{position:absolute;left:-26px;top:5px;width:15px;height:15px;display:grid;place-items:center;background:var(--bg);color:var(--i3)}
  .vC .it .dotn{width:7px;height:7px;border-radius:50%;background:var(--i3)}
  .vC .it.final .dotn{background:var(--i1);width:9px;height:9px}
  .vC .it .ringn{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--i3)}
  .vC .it.prosei{padding:4px 0 6px}.vC .it.prosei .node{top:9px}
  .vC .runbtn{display:inline-flex;align-items:center;gap:6px;color:var(--i2);font-size:13px;line-height:1.5;padding:2px 0}
  .vC .runbtn:hover,.vC .runbtn:hover .v{color:var(--i1)}
  .vC .sub{margin:2px 0 4px;display:flex;flex-direction:column}

function segments(steps){const out=[];let run=null;steps.forEach((s,i)=>{if(s.k==='text'){run=null;out.push({type:'text',s,i})}else{if(!run){run={type:'run',items:[],i};out.push(run)}run.items.push(s)}});return out}
const fmtDur=s=>s>=60?`${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`:`${s}s`;
const runSec=run=>run.items.reduce((a,s)=>a+(s.sec||0),0);

/* live script: which steps of T2 are visible at a given tick (replay) */
function liveTurn(tick){
  const base=T2.steps,steps=[];
  if(tick>=1)steps.push({...base[0],t:base[0].t.slice(0,Math.max(8,(tick-1)*4)),sec:Math.min(6,Math.ceil(tick/3)),live:tick<8});
  if(tick>=8)steps.push({...base[1],running:tick<14});
  if(tick>=14)steps.push({...base[2],running:tick<20});
  if(tick>=20){const full=STREAM.replace(/<\/?p>/g,'');const shown=Math.min(full.length,(tick-20)*3);
    let cut=full.slice(0,shown);if(/<[^>]*$/.test(cut))cut=cut.replace(/<[^>]*$/,'');
    const opens=(cut.match(/<code>/g)||[]).length-(cut.match(/<\/code>/g)||[]).length;if(opens>0)cut+='</code>';
    steps.push({k:'text',t:`<p>${cut}</p>`,streaming:shown<full.length})}
  return {user:false,live:true,ts:'14:41',steps};
}

function renderB(turns){

function wireLog(){

  if(cp){const prose=cp.closest('.turn')?.querySelectorAll('.prose');const txt=prose?[...prose].map(p=>p.innerText).join('\n\n'):'';navigator.clipboard?.writeText(txt).catch(()=>{});const o=cp.innerHTML;cp.classList.add('copied');cp.innerHTML=ic('check',14);setTimeout(()=>{cp.classList.remove('copied');cp.innerHTML=o},1200);return}
  const pt=e.target.closest('[data-expand]');if(pt){pt.closest('.bh').classList.toggle('expand');return}
  const jm=e.target.closest('[data-jump]');if(jm){root.querySelector('#blk'+jm.dataset.jump)?.scrollIntoView({block:'start'});return}
  const sg=e.target.closest('[data-sugg]');
  if(sg){const ta=root.querySelector('#ta');ta.value=sg.dataset.sugg;ta.dispatchEvent(new Event('input'));ta.focus();return}
  if(e.target.closest('#sendb')&&S.scene==='fresh'){const ta=root.querySelector('#ta');if(S.ready==='ready'&&ta.value.trim())startFreshSend(ta.value.trim());return}
  if(e.target.closest('#stopb')){sendTimers.forEach(clearTimeout);S.scene='stopped';render();return}
});

/* ===================== replay ===================== */
let timer=null;
function startReplay(){clearInterval(timer);S.scene='replay';S.tick=0;render();
  timer=setInterval(()=>{S.tick++;const full=STREAM.replace(/<\/?p>/g,'').length;if(S.tick>20+Math.ceil(full/3)+8){clearInterval(timer);S.scene='settled';render(true);return}render(true);const log=root.querySelector('.log');if(log)log.scrollTop=log.scrollHeight},90)}

/* ===================== shell panel ===================== */
const ctl=(id,label,opts)=>`<div class="ctl"><span>${label}</span><span class="shell-seg" data-ctl="${id}">${opts.map(([v,l])=>`<button data-val="${v}" class="${String(S[id])===String(v)?'on':''}">${l??v}</button>`).join('')}</span></div>`;
function contrastRows(){
  const b=BASE[S.theme],r=RAMP[S.theme][S.ink],ink=b.ink.split(',').map(Number),bg=hex(b.bg),panel=hex(b.panel);
  const names=['i1 body','i2 process verb','i3 time · object','i4 placeholder'];
  return r.map((a,i)=>{const mix=ink.map((c,j)=>c*a+bg[j]*(1-a));const ratioBg=ratio(mix,bg);const mixP=ink.map((c,j)=>c*a+panel[j]*(1-a));const rp=ratio(mixP,panel);
    const ok=i===3?null:(ratioBg>=4.5&&rp>=4.5);
    return `<div>${names[i]} α${a.toFixed(2)} → <b>${ratioBg.toFixed(1)}</b> / ${rp.toFixed(1)} ${ok===null?'<span class="no">decor</span>':ok?'<span class="ok">≥4.5</span>':'<span class="no">&lt;4.5</span>'}</div>`}).join('');
}
function renderPanel(){
  const p=document.getElementById('panel');
  p.innerHTML=`<div class="ide-section-title">Variants</div>`+Object.entries(VARIANTS).map(([k,v])=>`<div class="ide-variant-card ${S.v===k?'active':''}" data-variant="${k}"><h2>${v.t}</h2><p>${v.d}</p></div>`).join('')+
  `<div class="ide-section-title">Scenes</div>`+Object.entries(SCENES).map(([k,v])=>`<div class="ide-state-card ${S.scene===k?'active':''}" data-scene="${k}"><strong>${v[0]}</strong>${v[1]}</div>`).join('')+
  `<div class="ide-section-title">Addendum 2 · 变体</div>`+ctl('fresh','① Empty state',[['F1','Invitation'],['F2','Quiet']])+ctl('ready','① Agent',[['ready','Ready'],['starting','Starting']])+ctl('order','② Order',[['after','After'],['before','Before']])+ctl('load','③ Loading',[['L1','Shimmer'],['L2','Elapsed'],['L3','Bar']])+
  `<div class="ide-section-title">Canvas</div>`+ctl('theme','Theme',[['dark'],['light']])+ctl('w','Window width',[[560,'560'],[760,'760'],[1040,'1040']])+ctl('spec','Spec overlay (hover)',[[false,'off'],[true,'on']])+
  `<div class="ide-section-title">Type lab · 文字渲染</div>`+ctl('font','Prose font',[['sans','Sans'],['serif','Serif']])+ctl('size','Prose size',[['auto','Auto'],['13'],['14'],['15'],['16']])+ctl('lh','Leading',[['auto','Auto'],['1.5'],['1.65'],['1.8']])+ctl('fw','Body weight',[[400],[450],[500]])+ctl('ink','Ink contrast',[['soft'],['std'],['high']])+ctl('autospace','CJK/Latin autospace',[['on'],['off']])+ctl('smooth','Smoothing',[['antialiased'],['auto']])+
  `<div class="ratio">contrast vs bg / vs panel<br>${contrastRows()}</div>`;
  document.getElementById('storyBody').innerHTML=STORY;
}
document.getElementById('panel').addEventListener('click',e=>{
  const vc=e.target.closest('[data-variant]');if(vc){S.v=vc.dataset.variant;render();return}
  const sc=e.target.closest('[data-scene]');if(sc){clearInterval(timer);sendTimers.forEach(clearTimeout);const id=sc.dataset.scene;
    if(id==='replay')startReplay();else if(id==='freshsent')startFreshSend('帮我看看这个仓库的结构，然后列出可以改进的地方');else{S.scene=id;render()}return}
  const b=e.target.closest('[data-ctl] button');if(b){const id=b.parentElement.dataset.ctl;let v=b.dataset.val;if(id==='w'||id==='fw')v=+v;if(id==='spec')v=v==='true';S[id]=v;
    const jump={ready:'fresh',fresh:'fresh',order:'order',load:'running'}[id];if(jump&&S.scene!==jump){sendTimers.forEach(clearTimeout);S.scene=jump}
    render(true)}
});
/* spec overlay */
const specEl=document.getElementById('spec');
root.addEventListener('mousemove',e=>{
  if(!S.spec){specEl.style.display='none';return}
  const el=e.target.closest('.prose,.prose *,.bub,.uB,.trow,.trow *,.runbtn,.work,.think,.foot,.chip,.bh .pt,.stopped,.hint,.band');if(!el){specEl.style.display='none';return}
  const cs=getComputedStyle(el),m=cs.color.match(/[\d.]+/g)||[];
  specEl.textContent=`${el.tagName.toLowerCase()}${el.className&&typeof el.className==='string'?'.'+el.className.split(' ')[0]:''}\n${cs.fontSize} / ${cs.lineHeight} · wt ${cs.fontWeight}\ncolor ${m.length>3?`α${(+m[3]).toFixed(2)}`:'solid'} · ${cs.fontFamily.split(',')[0].replace(/"/g,'')}`;
  specEl.style.display='block';specEl.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';specEl.style.top=(e.clientY+16)+'px';
});
root.addEventListener('mouseleave',()=>specEl.style.display='none');

/* ===================== story ===================== */
const STORY=`<h1>Chat View · 重新设计</h1>
<p><b>决策点</b>：Chat 的「角色 + 过程 + 文字」该用哪套语言？锚点是 ChatGPT，但 Solco 的 Chat 是 coding agent 的 Chat——过程（读/搜/改/跑）比对话本身重。</p>
<ul><li><b>现状问题</b>：用户气泡是蓝色 accent、助手是带 <code>AGENT</code> 标签的描边卡、过程是三层 <code>details</code> 盒子，正文 13px/1.5 偏紧，CJK 行距不足。</li>
<li><b>三个方向</b>：A 把过程压成一行（最像 ChatGPT）；B 把过程摊成可审计的账本并给出改动卡；C 用竖线时间线服务长任务监督。</li>
<li><b>文字</b>：右栏 Type lab 可实时改字体/字号/行距/字重/墨色/CJK 间距；Spec overlay 悬停显示真实计算值；下方 contrast 行是按实际 α 混合出的比值。</li>
<li><b>约束</b>：只改 <code>frontend/src</code> 表现层；不新增桥方法；无投影；中性色，accent 只给链接；「narration 永不折叠」。</li></ul>`;

/* ===================== boot ===================== */
document.getElementById('panelCollapseBtn').onclick=()=>ideLayout.classList.add('panel-collapsed');
document.getElementById('panelExpandBtn').onclick=()=>ideLayout.classList.remove('panel-collapsed');
document.getElementById('storyToggleBtn').onclick=()=>{const c=ideLayout.classList.toggle('story-collapsed');document.getElementById('storyChevron').textContent=c?'▶':'▼'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')ideLayout.classList.add('panel-collapsed')});
const ideLayout=document.getElementById('ideLayout');
window.__chatProto={state:()=>({v:S.v,scene:S.scene,theme:S.theme,w:S.w}),set:(o)=>{Object.assign(S,o);render()}};
render();
if(S.scene==='replay')startReplay();
if(S.scene==='freshsent'){S.stage=0;startFreshSend('帮我看看这个仓库的结构，然后列出可以改进的地方')}
</script>
</body>
