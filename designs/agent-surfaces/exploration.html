<!DOCTYPE html>
<!--
  Solco · Agent surfaces —— Design Storybook（think → interactive-design-exploration）

  直接用浏览器打开（file://），无外部依赖、无构建。可用 URL hash 预置状态，例如 #v=tabs&tabsSide=0&many=1&theme=light。
  Tokens 来自真实实现：internal/nativeui/theme.go、design_system.go（字号 12/11/10.5、圆角 Row 8、行高 30）、
  git_sidebar_tree.go segmentTabs（弹层 Tab 的目标形态）、components.go treeRow（状态点/Spinner 现状）、terminal.go paneCard（聚焦蓝环现状）。
  品牌图取自 internal/nativeui/brands/*.png（base64 内嵌）；数据为示例，子代理形状取自本机 ~/.claude/projects/*/<session>/subagents/*.meta.json。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solco · Agent surfaces</title>
<!-- ============================ SHELL (Design Storybook) ============================ -->
<style>
  [data-ide-shell]{--shell-bg:#0f0f10;--shell-panel:#18181b;--shell-border:#27272a;--shell-text:#fafafa;--shell-muted:#a1a1aa;--shell-accent:#71717a;--panel-w:312px;
    box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--shell-bg);color:var(--shell-text);min-height:100vh;margin:0}
  [data-ide-shell] *{box-sizing:border-box}
  [data-ide-shell] .ide-layout{display:flex;min-height:100vh}
  [data-ide-shell] .ide-stage{flex:1;position:relative;display:flex;flex-direction:column;min-height:100vh;min-width:0;background:#111113}
  [data-ide-shell] .ide-stage-label{position:absolute;top:12px;left:14px;z-index:20;font-size:9px;font-weight:600;color:var(--shell-accent);text-transform:uppercase;letter-spacing:.06em;pointer-events:none}
  [data-ide-shell] .ide-panel-collapse-btn{position:absolute;top:10px;right:10px;z-index:30;width:28px;height:28px;border-radius:6px;border:1px solid var(--shell-border);background:var(--shell-panel);color:var(--shell-muted);cursor:pointer;font-size:12px}
  [data-ide-shell] .ide-artboard-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:34px 24px 18px}
  [data-ide-shell] .ide-artboard{display:none;width:100%;max-width:1240px}
  [data-ide-shell] .ide-artboard.active{display:block}
  [data-ide-shell] .ide-artboard .design-root{all:initial;display:block;font-family:inherit}
  [data-ide-shell] .ide-story-panel{width:var(--panel-w);flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--shell-border);background:var(--shell-panel);transition:width .2s;overflow:hidden;height:100vh;position:sticky;top:0}
  [data-ide-shell] .ide-layout.panel-collapsed .ide-story-panel{width:0;border-left:none}
  [data-ide-shell] .ide-panel-expand-btn{display:none;position:fixed;top:10px;right:10px;z-index:40;width:28px;height:28px;border-radius:6px;border:1px solid var(--shell-border);background:var(--shell-panel);color:var(--shell-muted);cursor:pointer;font-size:12px}
  [data-ide-shell] .ide-layout.panel-collapsed .ide-panel-expand-btn{display:grid;place-items:center}
  [data-ide-shell] .ide-panel-header{padding:12px 14px 8px;border-bottom:1px solid var(--shell-border);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--shell-muted);white-space:nowrap}
  [data-ide-shell] .ide-panel-controls{flex:1;overflow-y:auto;padding:12px 14px;min-height:0}
  [data-ide-shell] .ide-section-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--shell-accent);margin:0 0 6px}
  [data-ide-shell] .ide-section-title:not(:first-child){margin-top:14px}
  [data-ide-shell] .ide-variant-card,[data-ide-shell] .ide-state-card{padding:8px 10px;border-radius:6px;border:1px solid var(--shell-border);margin-bottom:5px;cursor:pointer;transition:border-color .12s,background .12s}
  [data-ide-shell] .ide-variant-card:hover,[data-ide-shell] .ide-state-card:hover{border-color:#3f3f46}
  [data-ide-shell] .ide-variant-card.active,[data-ide-shell] .ide-state-card.active{border-color:var(--shell-accent);background:rgba(113,113,122,.1)}
  [data-ide-shell] .ide-variant-card h2{font-size:11px;font-weight:600;margin:0 0 2px}
  [data-ide-shell] .ide-variant-card p{margin:0;color:var(--shell-muted);font-size:10px;line-height:1.4}
  [data-ide-shell] .ide-state-card{font-size:10px;line-height:1.4;color:var(--shell-muted)}
  [data-ide-shell] .ide-state-card strong{display:block;color:var(--shell-text);font-size:10.5px}
  [data-ide-shell] .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px;font-size:10.5px;color:var(--shell-muted)}
  [data-ide-shell] .shell-seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--shell-border);border-radius:7px}
  [data-ide-shell] .shell-seg button{all:unset;cursor:pointer;padding:3px 8px;border-radius:5px;font-size:10px;color:var(--shell-muted)}
  [data-ide-shell] .shell-seg button.on{background:#2c2c31;color:var(--shell-text)}
  [data-ide-shell] .ide-panel-story{border-top:1px solid var(--shell-border);flex-shrink:0}
  [data-ide-shell] .ide-story-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:none;background:rgba(255,255,255,.02);color:var(--shell-muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
  [data-ide-shell] .ide-story-toggle:hover{color:var(--shell-text);background:rgba(255,255,255,.04)}
  [data-ide-shell] .ide-story-body{padding:0 14px 14px;font-size:11px;line-height:1.55;color:var(--shell-muted);max-height:230px;overflow-y:auto}
  [data-ide-shell] .ide-layout.story-collapsed .ide-story-body{display:none}
  [data-ide-shell] .ide-story-body h1{font-size:13px;font-weight:600;color:var(--shell-text);margin:0 0 6px}
  [data-ide-shell] .ide-story-body p{margin:0 0 8px}
  [data-ide-shell] .ide-story-body ul{margin:0 0 8px;padding-left:16px}
  [data-ide-shell] .ide-story-body li{margin-bottom:4px}
  [data-ide-shell] .ide-story-body b{color:var(--shell-text);font-weight:600}
  [data-ide-shell] .ide-story-body code{font:10.5px ui-monospace,Menlo,monospace;background:#232327;padding:0 4px;border-radius:4px;color:#d4d4d8}
</style>
<style id="design-styles">
  @keyframes uspin{to{transform:rotate(360deg)}}
  @keyframes upop{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes ushim{0%{opacity:.45}50%{opacity:.9}100%{opacity:.45}}

  [data-ide-shell] .ide-artboard .design-root{
    --sb:#17171a;--bg:#141516;--card:#18191b;--text:#ececee;--muted:#8b8c92;
    --hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.08);--selS:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.07);--border:#333338;--accent:#0a84ff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;
    --card-border:rgba(230,230,230,.10);--track:rgba(255,255,255,.07);--fill:#d9d9de;--tabon:rgba(255,255,255,.10);--tabon-b:rgba(255,255,255,.10);
    --pill-shadow:0 1px 2px rgba(0,0,0,.3);--menu-bg:rgba(44,44,48,.96);--menu-border:rgba(255,255,255,.12);--scrim:rgba(0,0,0,.45);
    --tipbg:#ececee;--tiptx:#18181b;--pop-shadow:0 8px 24px rgba(0,0,0,.45);
    --s-claude:#d97757;--s-codex:#6d8bff;--s-other:#6b6b72;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-size:12px;line-height:1.3;color:var(--text);-webkit-font-smoothing:antialiased;
  }
  [data-ide-shell] .ide-artboard .design-root[data-theme="light"]{
    --sb:#efeff1;--bg:#fbfbfb;--card:#fff;--text:#18181b;--muted:#71717a;
    --hover:rgba(0,0,0,.05);--sel:rgba(0,0,0,.06);--selS:rgba(0,0,0,.11);
    --line:rgba(0,0,0,.07);--border:#e1e1e5;--ok:#16a34a;--warn:#c93400;--bad:#dc2626;
    --card-border:rgba(17,17,17,.10);--track:rgba(0,0,0,.06);--fill:#27272a;--tabon:#fff;--tabon-b:rgba(0,0,0,.08);
    --pill-shadow:0 1px 2px rgba(0,0,0,.12);--menu-bg:rgba(246,246,248,.96);--menu-border:rgba(0,0,0,.12);--scrim:rgba(0,0,0,.22);
    --tipbg:#18181b;--tiptx:#fafafa;--pop-shadow:0 8px 24px rgba(0,0,0,.18);--s-other:#a1a1aa;
  }
  [data-ide-shell] .ide-artboard .design-root .dk{display:inline}
  [data-ide-shell] .ide-artboard .design-root .lt{display:none}
  [data-ide-shell] .ide-artboard .design-root[data-theme="light"] .dk{display:none}
  [data-ide-shell] .ide-artboard .design-root[data-theme="light"] .lt{display:inline}

  [data-ide-shell] .ide-artboard .design-root{
    & *{box-sizing:border-box}
    & button{all:unset;box-sizing:border-box;cursor:default;color:inherit;font:inherit}
    & button:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:1px}
    & svg.ico{flex:none;display:block}
    & .mut{color:var(--muted)}
    & .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    & img.lg{border-radius:5px;flex:none;vertical-align:middle}
    & .mk{display:inline-grid;place-items:center;flex:none}
    & .pitile{display:inline-grid;place-items:center;border-radius:5px;background:#3a3a40;color:#e8e8ea;font-weight:700;flex:none}
    & .tile{display:grid;place-items:center;color:#fff;flex:none;font-weight:650}

    /* ---------- the one status indicator: a 16px trailing slot, dot and spinner share it ---------- */
    & .slot{width:16px;height:16px;display:grid;place-items:center;flex:none}
    & .si{display:block;flex:none}
    & .si.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--accent) 28%,transparent);border-top-color:var(--accent);animation:uspin .8s linear infinite}
    & .si.dot{width:7px;height:7px;border-radius:50%}
    & .si.dot.att{background:var(--warn)}
    & .si.dot.ok{background:var(--ok)}
    & .si.ring{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);opacity:.7}

    /* ---------- window ---------- */
    & .win{position:relative;display:grid;grid-template-columns:var(--sbw,262px) minmax(0,1fr);width:min(100%,var(--winw,1180px));margin:0 auto;height:clamp(600px,calc(100vh - 78px),800px);border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--bg);box-shadow:0 24px 60px rgba(0,0,0,.45)}
    & .sb{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--sb);border-right:1px solid var(--line)}
    & .sb-top{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px}
    & .tl{width:11px;height:11px;border-radius:50%;background:#56565b}
    & .vtabs{display:flex;gap:2px;padding:0 8px 8px;flex:none}
    & .vtab{flex:1;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
    & .vtab.on{background:var(--sel);color:var(--text)}
    & .sbody{flex:1;min-height:0;overflow:auto;padding:0 8px 10px;display:flex;flex-direction:column}
    & .sh{display:flex;align-items:center;gap:4px;height:26px;padding:0 6px;font-weight:600;font-size:12px;flex:none}
    & .sh .ico{color:var(--muted)}
    & .sh .cnt{margin-left:auto;font-weight:400;font-size:10.5px;color:var(--muted)}
    & .sh:hover{background:var(--hover);border-radius:6px}
    & .glab{height:22px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:color-mix(in srgb,var(--muted) 78%,transparent);letter-spacing:.01em;margin-top:4px}
    & .arow,& .wrow,& .trow{position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 8px;border-radius:7px;min-width:0}
    & .arow:hover,& .wrow:hover,& .trow:hover{background:var(--hover)}
    & .arow.on,& .wrow.on,& .trow.on{background:var(--sel)}
    & .arow .ago{font-size:10.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
    & .arow.sub{height:26px;padding-left:30px;font-size:11.5px;color:var(--muted)}
    & .arow.sub::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:1px;background:var(--line)}
    & .arow.sub.last::before{bottom:50%}
    & .arow.sub::after{content:"";position:absolute;left:16px;top:50%;width:8px;height:1px;background:var(--line)}
    & .arow.sub b{font-weight:550;color:var(--text);opacity:.85}
    & .arow .sg{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;height:16px;flex:none}
    & .arow .fold{position:absolute;left:-6px;width:12px;height:12px;display:none;place-items:center;color:var(--muted)}
    & .arow:hover .fold{display:grid}
    & .wrow .nm{flex:1;min-width:0;font-weight:500}
    & .wrow .br{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);flex:none;max-width:84px}
    & .wrow .dirty{width:6px;height:6px;border-radius:50%;background:#d9b66a;flex:none}
    & .wrow.two{height:40px}
    & .wrow.two .col{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
    & .wrow.two .col small{font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
    & .wrow .pc{font-size:10px;color:var(--muted);flex:none}
    & .trow{height:28px;padding-left:30px}
    & .trow::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:1px;background:var(--line)}
    & .trow.last::before{bottom:50%}
    & .trow::after{content:"";position:absolute;left:16px;top:50%;width:8px;height:1px;background:var(--line)}
    & .foot{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-top:1px solid var(--line);color:var(--muted)}
    & .foot .chipf{display:flex;align-items:center;gap:7px;flex:1;min-width:0;font-size:11.5px;color:var(--text)}
    & .sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

    /* ---------- main + title bar ---------- */
    & .main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
    & .tb{height:38px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 10px;min-width:0}
    & .tb.bar{height:40px}
    & .ib{position:relative;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
    & .ib:hover{background:var(--hover);color:var(--text)}
    & .ib.on{background:var(--sel);color:var(--text)}
    & .ib.off{opacity:.45;pointer-events:none}
    & .crumb{display:flex;align-items:center;gap:0;min-width:0}
    & .cc{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:8px;font-weight:500;min-width:0}
    & .cc:hover{background:var(--hover)}
    & .cc.cur{color:var(--text)}
    & .cc:not(.cur){color:var(--muted)}
    & .cs{color:var(--muted);opacity:.6;display:grid;place-items:center}
    & .grow{flex:1;min-width:8px}

    /* activity trigger + badge (2/4) */
    & .trig{position:relative;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:8px;color:var(--muted);flex:none}
    & .trig:hover,& .trig.on{background:var(--hover);color:var(--text)}
    & .trig.sq{width:26px;padding:0;justify-content:center}
    & .cnt2{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;gap:1px;align-items:baseline}
    & .cnt2 i{font-style:normal;font-weight:400;color:var(--muted)}
    & .cnt2 .w.att{color:var(--warn)}.cnt2 .w.ok{color:var(--ok)}.cnt2 .w.wk{color:var(--accent)}.cnt2 .w.mu{color:var(--muted)}
    & .cbadge{position:absolute;top:-4px;right:-8px;min-width:22px;height:14px;border-radius:7px;padding:0 4px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
    & .cbadge.att{background:var(--warn)}.cbadge.ok{background:var(--ok)}.cbadge.wk{background:var(--accent)}.cbadge.mu{background:#6b6b72}

    /* tab bar in the title bar */
    & .tabs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
    & .tabs::-webkit-scrollbar{display:none}
    & .tabs.of{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
    & .tab{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 6px 0 9px;border-radius:8px;font-weight:500;color:var(--muted);flex:none;max-width:190px}
    & .tab:hover{background:var(--hover);color:var(--text)}
    & .tab.on{background:var(--sel);color:var(--text)}
    & .tab .x{width:16px;height:16px;border-radius:5px;display:none;place-items:center;color:var(--muted)}
    & .tab.on .x,& .tab:hover .x{display:grid}
    & .tab .x:hover{background:var(--selS);color:var(--text)}
    & .tab .pn{font-size:10px;color:var(--muted)}
    & .tabs.browser{gap:0;align-self:flex-end;height:100%;padding-top:6px}
    & .tabs.browser .tab{height:100%;border-radius:9px 9px 0 0;padding:0 8px 0 10px;position:relative;background:transparent;border-right:0}
    & .tabs.browser .tab:not(.on)::after{content:"";position:absolute;right:0;top:9px;bottom:9px;width:1px;background:var(--line)}
    & .tabs.browser .tab.on{background:var(--card);box-shadow:0 0 0 1px var(--card-border);clip-path:inset(-2px -2px 0 -2px)}
    & .tabs.browser .tab:hover:not(.on){background:var(--hover)}
    & .newtab{flex:none}

    /* ---------- pane cards ---------- */
    & .panes{flex:1;min-height:0;display:flex;gap:8px;padding:6px 10px 10px}
    & .pane{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:10px;background:var(--card);border:1px solid var(--card-border);overflow:hidden;transition:border-color .15s,box-shadow .15s,background .15s,opacity .15s}
    & .ph{height:34px;flex:none;display:flex;align-items:center;gap:7px;padding:0 8px 0 12px;min-width:0}
    & .ph .ti{font-weight:600;flex:none}
    & .ph .pa{color:var(--muted);font-size:11px;min-width:0}
    & .ph .acts{display:none;align-items:center;gap:1px;flex:none}
    & .pane.f .acts,& .pane:hover .acts{display:flex}
    & .ph .ib{width:22px;height:22px;border-radius:6px}
    & .term{flex:1;min-height:0;padding:6px 14px 12px;font:11.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);overflow:hidden;opacity:.92}
    & .term .d{color:var(--muted)}.term .g{color:var(--ok)}.term .r{color:var(--bad)}.term .b{color:var(--accent)}
    & .term .del{display:block;background:rgba(255,69,58,.16);margin:0 -14px;padding:0 14px}
    & .term .add{display:block;background:rgba(48,209,88,.14);margin:0 -14px;padding:0 14px}
    /* focus treatments */
    & .pane.f{border-color:var(--card-border)}
    &[data-focus="blue"] .pane.f{border-color:rgba(10,132,255,.6)}
    &[data-focus="ring"] .pane.f{border-color:rgba(255,255,255,.52)}
    &[data-theme="light"][data-focus="ring"] .pane.f{border-color:rgba(0,0,0,.42)}
    &[data-focus="raised"] .pane.f{background:color-mix(in srgb,var(--card) 82%,#fff);border-color:rgba(255,255,255,.16);box-shadow:0 6px 20px rgba(0,0,0,.35)}
    &[data-theme="light"][data-focus="raised"] .pane.f{background:#fff;border-color:rgba(0,0,0,.16);box-shadow:0 6px 20px rgba(0,0,0,.14)}
    &[data-focus="raised"] .pane:not(.f){opacity:.72}
    &[data-focus="line"] .pane.f .ph{box-shadow:inset 0 -2px 0 var(--text)}
    &[data-focus="line"] .pane:not(.f) .ph .ti{color:var(--muted)}

    /* ---------- popover ---------- */
    & .pop{position:absolute;z-index:40;top:44px;right:48px;width:400px;background:var(--menu-bg);backdrop-filter:blur(24px) saturate(1.3);border:1px solid var(--menu-border);border-radius:12px;box-shadow:var(--pop-shadow);display:flex;flex-direction:column;max-height:520px;animation:upop .14s ease-out}
    & .pop::before{content:"";position:absolute;top:-6px;right:var(--arrow,40px);width:11px;height:11px;transform:rotate(45deg);background:var(--menu-bg);border-left:1px solid var(--menu-border);border-top:1px solid var(--menu-border);border-radius:3px 0 0 0}
    & .pop .pt{padding:8px 8px 4px;flex:none}
    & .stabs{display:flex;gap:1px;padding:2px;background:var(--track);border-radius:8px}
    & .stabs button{flex:1;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:500;white-space:nowrap}
    & .stabs button:hover{color:var(--text)}
    & .stabs button.on{background:var(--tabon);color:var(--text);box-shadow:var(--pill-shadow)}
    & .stabs button em{font-style:normal;font-size:10px;color:var(--muted)}
    & .pop .pb{flex:1;min-height:0;overflow:auto;padding:2px 6px 8px}
    & .gh{display:flex;align-items:center;gap:6px;padding:8px 8px 3px;font-size:11px;font-weight:550;color:var(--muted)}
    & .gh .si.dot{width:7px;height:7px}
    & .gh span.n{font-weight:400;font-size:10.5px}
    & .pcard{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 8px;border-radius:7px}
    & .pcard:hover{background:var(--hover)}
    & .pcard .col{display:flex;flex-direction:column;min-width:0;flex:1}
    & .pcard .l2{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--muted);min-width:0}
    & .pcard .ago{font-size:10.5px;color:var(--muted);flex:none}
    & .pcard .sg{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;height:16px;flex:none}
    & .pf{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--menu-border);font-size:11px;color:var(--muted)}
    & .pf a{color:var(--text);margin-left:auto;display:inline-flex;align-items:center;gap:3px}
    & .pf a:hover{text-decoration:underline}

    /* limits tab · three card styles */
    & .lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:6px 2px 2px}
    & .lc{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
    &[data-theme="light"] .lc{background:rgba(0,0,0,.03)}
    & .lc .h{display:flex;align-items:center;gap:6px;min-width:0}
    & .lc .h b{font-weight:600;font-size:11.5px}
    & .lc .big{display:flex;align-items:baseline;gap:5px}
    & .lc .big strong{font-size:19px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
    & .lc .big small{font-size:10.5px;color:var(--muted)}
    & .lc .big strong.warn{color:var(--warn)}.lc .big strong.bad{color:var(--bad)}
    & .lbar{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
    & .lbar i{display:block;height:100%;background:var(--fill);border-radius:2px}
    & .lbar.warn i{background:var(--warn)}.lbar.bad i{background:var(--bad)}
    & .lc .f{font-size:10.5px;color:var(--muted);display:flex;gap:6px;min-width:0}
    & .lc .f .t{flex:1}
    & .chp{font-size:10px;border-radius:5px;padding:0 5px;height:16px;display:inline-flex;align-items:center;background:var(--hover);color:var(--muted);white-space:nowrap}
    & .lrows{display:flex;flex-direction:column;padding:4px 2px 2px}
    & .lr{display:flex;align-items:center;gap:9px;min-height:40px;padding:5px 8px;border-radius:8px}
    & .lr:hover{background:var(--hover)}
    & .lr .nm{width:92px;flex:none;display:flex;flex-direction:column;min-width:0}
    & .lr .nm small{font-size:10px;color:var(--muted)}
    & .lr .mb{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
    & .lr .mb div{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
    & .lr .mb div span.k{width:20px;flex:none}
    & .lr .mb div .lbar{flex:1}
    & .lr .mb div b{width:28px;text-align:right;color:var(--text);font-weight:550;font-variant-numeric:tabular-nums}
    & .lr .mb div b.warn{color:var(--warn)}
    & .lring{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px 2px 2px}
    & .lg3{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 8px;border-radius:9px;background:rgba(255,255,255,.045);border:1px solid var(--line);min-width:0}
    &[data-theme="light"] .lg3{background:rgba(0,0,0,.03)}
    & .lg3 b{font-size:11px;font-weight:600}
    & .lg3 small{font-size:10px;color:var(--muted)}
    & .rg-tr{stroke:var(--track)}
    & .rg{stroke:var(--fill)}.rg.warn{stroke:var(--warn)}.rg.bad{stroke:var(--bad)}
    & svg text{fill:var(--text);font-family:inherit}

    /* ---------- settings + name specimens ---------- */
    & .pg{flex:1;min-height:0;overflow:auto;padding:12px 24px 24px}
    & .pgi{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
    & .pgi h1{margin:0;font-size:17px;font-weight:650}
    & .sg2{display:flex;flex-direction:column;gap:6px}
    & .sg2>.sgh{font-size:11px;font-weight:600;color:var(--muted);padding:0 2px}
    & .sgc{background:var(--card);border:1px solid var(--card-border);border-radius:10px;overflow:hidden}
    & .fr{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line);min-height:44px}
    & .fr:first-child{border-top:none}
    & .fr .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
    & .fr .l small{color:var(--muted);font-size:11px;line-height:1.4}
    & .sw{width:30px;height:18px;border-radius:9px;background:var(--track);position:relative;flex:none;transition:background .12s}
    & .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .12s}
    & .sw.on{background:var(--ok)}.sw.on::after{transform:translateX(12px)}
    & .specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:6px 20px 24px;overflow:auto}
    & .spec{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
    & .spec h3{margin:0;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    & .cand{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:11.5px;line-height:1.45}
    & .cand b{font-weight:650}
    & .cand.rec{outline:1px solid var(--text);outline-offset:6px;border-radius:2px}
    & .navrow{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:7px;font-weight:500}
    & .navrow.on{background:var(--sel)}
    & .navrow .ico{color:var(--muted)}
    & .navrow.on .ico{color:var(--text)}
    & .hl{outline:1.5px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px;border-radius:5px}
    & .tip{position:fixed;z-index:80;pointer-events:none;background:var(--tipbg);color:var(--tiptx);border-radius:8px;padding:6px 12px;font-size:12px;max-width:320px;line-height:1.4}
    & .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);padding:2px 4px}
    & .legend span{display:inline-flex;align-items:center;gap:6px}
  }
</style>
</head>

const VARS=[
 ['pop','1 · Header popover','Agents / Limits / Services / Tasks on the Git panel\'s Changes·Commits tab face; the 2/4 badge.'],
 ['agents','2 · Sidebar Agents','Grouped by workspace, sub-agents nested, last-active time, status in the trailing slot.'],
 ['ws','3 · Sidebar Workspace','Tile + branch + dirty + trailing status; three densities.'],
 ['pane','4 · Pane card','Neutral focus instead of blue; status moves to the right edge, same indicator.'],
 ['tabs','5 · Tab placement','Settings switch: tabs in the sidebar tree, or a scrolling tab bar in the title bar.'],
 ['name','6 · Name','Replaces “Usage”; shown in sidebar, title bar, popover tab, settings.']
];
const seg=(k,opts)=>`<span class="shell-seg" data-ctl="${k}">${opts.map(([v,l])=>`<button data-val="${v}" class="${String(S[k])===String(v)?'on':''}">${l}</button>`).join('')}</span>`;
function renderCtl(){
 const h=$('#ctlHost');
 h.innerHTML=`<div class="ide-section-title">Focus area</div>`+VARS.map(([k,t,d])=>`<div class="ide-variant-card ${S.v===k?'active':''}" data-v="${k}"><h2>${t}</h2><p>${d}</p></div>`).join('')+
 `<div class="ide-section-title">Knobs</div>
 <div class="ctl">Theme${seg('theme',[['dark','Dark'],['light','Light']])}</div>
 <div class="ctl">Name${seg('name',[['Limits','Limits'],['Quota','Quota'],['Allowance','Allow.'],['Meter','Meter'],['Usage','Usage']])}</div>
 <div class="ctl">Badge${seg('badge',[['inline','Inline 2/4'],['corner','Corner']])}</div>
 <div class="ctl">Popover groups${seg('group',[['status','Status'],['workspace','Workspace']])}</div>
 <div class="ctl">Limits cards${seg('lstyle',[['cards','Cards'],['rows','Rows'],['rings','Rings']])}</div>
 <div class="ctl">Sub-agents${seg('sub',[['tree','Tree'],['chips','Chip'],['off','Off']])}</div>
 <div class="ctl">Workspace row${seg('ws',[['tile','Tile'],['two','Two-line'],['plain','Plain']])}</div>
 <div class="ctl">Pane focus${seg('focus',[['ring','Ring'],['raised','Raised'],['line','Line'],['blue','Blue (now)']])}</div>
 <div class="ctl">Tabs in${seg('tabsSide',[[true,'Sidebar'],[false,'Title bar']])}</div>
 <div class="ctl">Tab bar${seg('tabStyle',[['flat','Flat'],['browser','Browser']])}</div>
 <div class="ctl">Tab count${seg('many',[[false,'4'],[true,'14']])}</div>
 <div class="ctl">Window${seg('winw',[[1180,'1180'],[960,'960']])}</div>
 <div class="ide-section-title">Interaction states</div>
 <div class="ide-state-card" data-state="pop-agents"><strong>Popover · Agents</strong>Grouped by status; waiting/total in the footer</div>
 <div class="ide-state-card" data-state="pop-limits"><strong>Popover · ${NAME()}</strong>Quota cards for the providers switched on</div>
 <div class="ide-state-card" data-state="settings"><strong>Settings · Show Tabs in Sidebar</strong>Flip the switch and watch the tabs move</div>
 <div class="ide-state-card" data-state="overflow"><strong>Tab bar · 14 tabs</strong>Fade edges, ‹ › scroll, active tab stays in view</div>
 <div class="ide-state-card" data-state="calm"><strong>Nothing waiting</strong>Badge reads 0/7, quiet tone</div>`;
 $('#storyBody').innerHTML=STORY[S.v]||'';
}

const STORY={
 pop:`<h1>Header popover</h1><p><b>Tabs</b> now use the same <code>segmentTabs</code> face as Changes | Commits (icon + label + count), replacing the plain <code>segmentedControl</code> in <code>quick_panel.go</code>. A fourth tab <b>Limits</b> reuses the Usage service; it reads when the tab opens (TTL cache), never on a timer.</p><p><b>2/4</b> = waiting-for-you / agents running (attention + review over all live agents, idle included). Numerator takes the strongest tone. Alternative: count only non-idle agents in the denominator.</p><p>Limits cards show one headline number (tightest window, or the count for counted plans), one bar, one reset line. Details stay on the full page.</p>`,
 agents:`<h1>Sidebar Agents</h1><p>Agents group under a faint workspace label. The trailing <b>time + slot</b> replaces the corner dot: working = spinner, attention = orange dot, review = green dot, idle = hollow ring — all in the <i>same 16px slot</i>, so they overlap, never sit side by side.</p><p><b>Sub-agents</b> hang off their parent with a guide line. Open while the parent works or a child runs; folded to a <code>⤷ N</code> chip once all are done (chevron on hover toggles).</p><p><b>Data:</b> Herdr has no parent field. Claude Code writes <code>&lt;session&gt;/subagents/agent-*.meta.json</code> (agentType, description, toolUseId, spawnDepth) — verified on this Mac. A child counts as running while its jsonl was written in the last ~20 s. Other providers show no children until their files are verified.</p>`,
 ws:`<h1>Sidebar Workspace</h1><p>Per your second screenshot but without machines: a coloured letter tile, name, branch (hidden when narrow), a tan dot for uncommitted changes, and the shared status slot (strongest state among its tabs: attention &gt; review &gt; working &gt; idle).</p><p><b>Tile</b> is the densest. <b>Two-line</b> gives branch and path room. <b>Plain</b> keeps today's folder glyph and adds the tab count.</p>`,
 pane:`<h1>Pane card</h1><p>Focus no longer uses the accent. <b>Ring</b>: 1px neutral line (text colour at ~50%). <b>Raised</b>: focused card lifts, others dim. <b>Line</b>: a 2px rule under the header, unfocused titles mute. <b>Blue</b> is today, for comparison.</p><p>The working path is already beside the title; the status indicator moves to the right edge and is the same function as the sidebar's. Hover/focus actions slide in to its left.</p>`,
 tabs:`<h1>Tab placement</h1><p>Settings › General › <b>Show Tabs in Sidebar</b> (default on). Off: the sidebar keeps Workspaces only, and the breadcrumb is replaced by a tab bar for the selected Workspace. Each tab shows its agent mark, strongest state, pane count; × appears on hover. Overflow scrolls with edge fades and ‹ › buttons; the active tab scrolls into view.</p><p><b>Flat</b> matches the ghost-chip breadcrumb; <b>Browser</b> joins the active tab to the content.</p>`,
 name:`<h1>Name</h1><p>“Usage” promises spend and history, which this page refuses to show. It is about what is <i>left</i> and <i>when it resets</i>.</p><p>Renaming touches labels, the route (<code>/usage</code> → <code>/limits</code>, old saved route migrates), docs; the Go package <code>internal/usage</code> stays.</p>`
};

/* ================= wiring ================= */
const PRESET={
 pop:()=>{S.pop=true;S.popTab='agents';S.page='work'},
 agents:()=>{S.pop=false;S.page='work';S.tabsSide=true},
 ws:()=>{S.pop=false;S.page='work';S.tabsSide=true},
 pane:()=>{S.pop=false;S.page='work'},
 tabs:()=>{S.pop=false;S.page='work';S.tabsSide=false},
 name:()=>{S.pop=false;S.page='work'}
};
document.addEventListener('click',e=>{
 const v=e.target.closest('.ide-variant-card');
 if(v){S.v=v.dataset.v;PRESET[S.v]();render();return}
 const b=e.target.closest('[data-ctl] button');
 if(b){const k=b.parentElement.dataset.ctl;let val=b.dataset.val;if(val==='true')val=true;else if(val==='false')val=false;else if(k==='winw')val=+val;S[k]=val;render();return}
 const st=e.target.closest('[data-state]');
 if(st){const s=st.dataset.state;S.page='work';
  if(s==='pop-agents'){S.v='pop';S.pop=true;S.popTab='agents'}
  if(s==='pop-limits'){S.v='pop';S.pop=true;S.popTab='limits'}
  if(s==='settings'){S.v='tabs';S.pop=false;S.page='settings'}
  if(s==='overflow'){S.v='tabs';S.pop=false;S.tabsSide=false;S.many=true}
  if(s==='calm'){AG.forEach(a=>{a._st=a._st||a.st;a.st=a.st==='working'?'working':'idle'});S.v='pop';S.pop=true;S.popTab='agents'}
  render();return}
 const a=e.target.closest('[data-act]');
 if(!a){if(S.pop&&!e.target.closest('.pop')){S.pop=false;render()}return}
 const act=a.dataset.act,id=a.dataset.id;
 if(act==='pop'){S.pop=!S.pop;render()}
 else if(act==='poptab'){S.popTab=id;render()}
 else if(act==='agent'){const g=AG.find(x=>x.id===id);S.selWs=g.ws;S.selTab=g.tab;S.selPane=g.id;if(S.pop)S.pop=false;render()}
 else if(act==='ws'){S.selWs=id;const t=tabsOf(id)[0];S.selTab=t.id;const ag=agentsOfTab(t.id)[0];S.selPane=ag?ag.id:null;render()}
 else if(act==='tab'){if(e.target.closest('.x'))return;S.selTab=id;const ag=agentsOfTab(id)[0];S.selPane=ag?ag.id:null;render()}
 else if(act==='pane'){S.selPane=id;render()}
 else if(act==='fold'){const g=AG.find(x=>x.id===id);S.fold[id]=subsOpen(g);e.stopPropagation();render()}
 else if(act==='tabsSide'){S.tabsSide=!S.tabsSide;render()}
 else if(act==='scroll'){const t=$('#tabs');if(t)t.scrollBy({left:+a.dataset.dir*220})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.pop){S.pop=false;render()}else if(document.activeElement===document.body)$('#ideLayout').classList.toggle('panel-collapsed')}});
$('#collapseBtn').addEventListener('click',()=>$('#ideLayout').classList.add('panel-collapsed'));
$('#expandBtn').addEventListener('click',()=>$('#ideLayout').classList.remove('panel-collapsed'));
$('#storyToggle').addEventListener('click',()=>{const l=$('#ideLayout');l.classList.toggle('story-collapsed');$('#storyCaret').textContent=l.classList.contains('story-collapsed')?'▸':'▾'});
/* tooltips */
let tipEl=null,tipT=null;
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');clearTimeout(tipT);if(tipEl){tipEl.remove();tipEl=null}
 if(!el)return;tipT=setTimeout(()=>{const r=el.getBoundingClientRect();tipEl=document.createElement('div');tipEl.className='tip';tipEl.textContent=el.dataset.tip;
  $('#root').appendChild(tipEl);const w=tipEl.offsetWidth;tipEl.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tipEl.style.top=(r.bottom+8)+'px'},350)});
/* hash presets for smoke / screenshots: #v=tabs&pop=0&many=1&theme=light … */
location.hash.slice(1).split('&').filter(Boolean).forEach(kv=>{const [k,v]=kv.split('=');
 if(k==='v'){S.v=v;PRESET[v]&&PRESET[v]()}else if(k==='pop')S.pop=v==='1';else if(k==='many')S.many=v==='1';else if(k==='tabsSide')S.tabsSide=v==='1';else if(k==='page')S.page=v;else if(k in S)S[k]=isNaN(+v)?v:+v});
window.__surf={S,AG,waiting,total,render};
render();
</script>
</body>
</html>
