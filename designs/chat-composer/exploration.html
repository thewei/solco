    [data-ide-shell] .design-root .win{position:relative;background:var(--content);border:1px solid var(--hair);border-radius:12px;height:640px;overflow:hidden;display:flex;flex-direction:column}
    [data-ide-shell] .design-root .head{color:var(--i1);height:38px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;font-weight:600}

    [data-ide-shell] .design-root .thread{flex:1;overflow:hidden;position:relative}
    [data-ide-shell] .design-root .col{width:min(100% - 48px,640px);margin:0 auto}
    [data-ide-shell] .design-root .u{margin:22px 0 0 auto;max-width:78%;background:var(--tint2);border-radius:18px;padding:8px 14px;width:fit-content}
    [data-ide-shell] .design-root .a{margin:14px 0;color:var(--i1)}
    [data-ide-shell] .design-root .sum{margin:6px 0;font-size:12px;color:var(--i3)}

    [data-ide-shell] .design-root .att i{font-style:normal;color:var(--i4);font-size:10px}
    [data-ide-shell] .design-root .att .x{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;color:var(--i3);display:grid;place-items:center}

    [data-ide-shell] .design-root .pop.model{left:auto;right:36px;width:320px}

    [data-ide-shell] .design-root .row .k{font-size:10px;color:var(--i4);border:1px solid var(--hair);border-radius:5px;padding:0 5px;white-space:nowrap}
    [data-ide-shell] .design-root .row .ck{color:var(--i1);width:14px}
    [data-ide-shell] .design-root .pf{border-top:1px solid var(--hair);margin-top:4px;padding:6px 10px 2px;font-size:10.5px;color:var(--i4);display:flex;gap:12px}
    [data-ide-shell] .design-root .note{padding:6px 10px;font-size:11px;color:var(--i3)}
    [data-ide-shell] .design-root .note b{color:var(--warn);font-weight:500}
    [data-ide-shell] .design-root .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);background:var(--i1);color:var(--content);border-radius:10px;padding:6px 12px;font-size:11.5px;white-space:nowrap}
    [data-ide-shell] .design-root .drop{position:absolute;inset:8px;border:1.5px dashed var(--hair2);border-radius:14px;background:rgba(var(--ink),.04);display:grid;place-items:center;color:var(--i2);font-size:13px;z-index:5;backdrop-filter:blur(2px)}

    /* TOC rail (reference: Codex turn outline) */
    [data-ide-shell] .design-root .toc{position:absolute;left:14px;top:60px;bottom:140px;width:46px;display:flex;flex-direction:column;justify-content:center;gap:0;z-index:4}

    [data-ide-shell] .design-root .card .r .l span{color:var(--i3);font-size:11.5px}
    [data-ide-shell] .design-root .btn{height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--hair2);font-size:12px}
    [data-ide-shell] .design-root .btn.pri{background:var(--i1);color:var(--content);border-color:transparent}
    [data-ide-shell] .design-root .pill{display:inline-flex;gap:6px;align-items:center;font-size:11.5px}
    [data-ide-shell] .design-root .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--i4))}
    [data-ide-shell] .design-root .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;border-radius:12px;z-index:9}
    [data-ide-shell] .design-root .dlg{width:440px;background:var(--panel);border:1px solid var(--hair2);border-radius:14px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.5)}

    [data-ide-shell] .design-root .dlg ul{margin:8px 0 14px;padding-left:18px;color:var(--i2);font-size:12px}
    [data-ide-shell] .design-root .dlg li{margin-bottom:4px}
    [data-ide-shell] .design-root .dlg .ft{display:flex;justify-content:flex-end;gap:8px}

    /* matrix */
    [data-ide-shell] .design-root table{width:100%;border-collapse:collapse;font-size:12px;background:var(--content);border:1px solid var(--hair);border-radius:12px;overflow:hidden}
    [data-ide-shell] .design-root th,[data-ide-shell] .design-root td{padding:9px 12px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
    [data-ide-shell] .design-root th{color:var(--i3);font-weight:500;font-size:11px;background:var(--panel)}
    [data-ide-shell] .design-root td.cap{color:var(--i1);font-weight:500;white-space:nowrap}
    [data-ide-shell] .design-root .s{display:inline-block;font-size:10px;border-radius:5px;padding:0 6px;margin-right:6px;border:1px solid var(--hair2)}
    [data-ide-shell] .design-root .s.ok{color:var(--ok)} .design-root .s.tv{color:var(--warn)} .design-root .s.no{color:var(--i4)}
  </style>
</head>

  const vl=$('variantList');vl.innerHTML='';
  Object.entries(VARIANTS).forEach(([id,c])=>{const d=document.createElement('div');d.className='ide-variant-card'+(id===activeVariant?' active':'');d.innerHTML=`<h2>${c.title}</h2><p>${c.desc}</p>`;d.onclick=()=>setVariant(id);vl.appendChild(d)});
  const sl=$('statesList');sl.innerHTML='';const states=VARIANTS[activeVariant].states;$('statesSectionTitle').hidden=!states.length;
  states.forEach(s=>{const d=document.createElement('div');d.className='ide-state-card'+(s===activeState?' active':'');d.innerHTML=`<strong>${STATE_LABELS[s]||s}</strong>`;d.onclick=()=>setState(s);sl.appendChild(d)});
}
function paint(){$('stageLabel').textContent=`${VARIANTS[activeVariant].title} · ${STATE_LABELS[activeState]||'Default'}`;$('storyBody').innerHTML=STORY[activeVariant]||STORY.C;renderCards();render()}
function setVariant(v){activeVariant=v;activeState=VARIANTS[v].states[0]??'';paint()}
function setState(s){activeState=(activeState===s&&s!=='')?(VARIANTS[activeVariant].states[0]??''):s;paint()}
$('panelCollapseBtn').onclick=()=>$('ideLayout').classList.add('panel-collapsed');
$('panelExpandBtn').onclick=()=>$('ideLayout').classList.remove('panel-collapsed');
$('storyToggleBtn').onclick=()=>{const c=$('ideLayout').classList.toggle('story-collapsed');$('storyChevron').textContent=c?'▶':'▼'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(activeState&&activeState!==VARIANTS[activeVariant].states[0])setState(activeState);else $('ideLayout').classList.add('panel-collapsed')}});
/* deep link: #variant/state/agent/theme  e.g. #C/slash/codex/light */
(function(){const [v,st,ag,th]=location.hash.slice(1).split('/');
  if(ag&&AGENTS[ag])agent=ag; if(th==='light')light=true;
  setVariant(VARIANTS[v]?v:'C'); if(VARIANTS[activeVariant].states.includes(st||'slash')&&!(v&&!st))setState(st||'slash');
  if(v&&VARIANTS[v]&&st!==undefined&&st!==''&&VARIANTS[v].states.includes(st)){activeState=st;paint()}
  if(location.hash.includes('full'))document.getElementById('ideLayout').classList.add('panel-collapsed');})();
</script>
</body>
</html>
