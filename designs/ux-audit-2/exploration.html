<!DOCTYPE html>
<!--
  Solco · UX audit 第二轮 2026-10-30 —— Design Storybook（think Triage → interactive-design-exploration）
  直接用浏览器打开（file://），无外部依赖、无构建。URL hash 可预置：#t=keys&keys=A&keysView=sheet、#t=sess&sess=B、#t=clean&clean=A&ahead=2、#t=bugs。
  Tokens 与 agent-surfaces 探索稿一致（取自 internal/nativeui/theme.go / design_system.go）；状态色取自 operational.go（Review=ToneSuccess 绿，Service=ToneSuccess 绿 —— 同色异义是本稿议题 1 的根因）。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solco · UX audit 2</title>
<style>
  [data-ide-shell]{--shell-bg:#0f0f10;--shell-panel:#18181b;--shell-border:#27272a;--shell-text:#fafafa;--shell-muted:#a1a1aa;--shell-accent:#71717a;--panel-w:312px;
    box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--shell-bg);color:var(--shell-text);min-height:100vh;margin:0}
  [data-ide-shell] *{box-sizing:border-box}
  [data-ide-shell] .ide-layout{display:flex;min-height:100vh}
  [data-ide-shell] .ide-stage{flex:1;position:relative;display:flex;flex-direction:column;min-height:100vh;min-width:0;background:#111113}
  [data-ide-shell] .ide-stage-label{position:absolute;top:12px;left:14px;z-index:20;font-size:9px;font-weight:600;color:var(--shell-accent);text-transform:uppercase;letter-spacing:.06em;pointer-events:none}
  [data-ide-shell] .ide-panel-collapse-btn{position:absolute;top:10px;right:10px;z-index:30;width:28px;height:28px;border-radius:6px;border:1px solid var(--shell-border);background:var(--shell-panel);color:var(--shell-muted);cursor:pointer;font-size:12px}
  [data-ide-shell] .ide-artboard-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:34px 24px 18px}
  [data-ide-shell] .ide-artboard{display:none;width:100%;max-width:1240px}
  [data-ide-shell] .ide-artboard.active{display:block}
  [data-ide-shell] .ide-artboard .design-root{all:initial;display:block;font-family:inherit}
  [data-ide-shell] .ide-story-panel{width:var(--panel-w);flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--shell-border);background:var(--shell-panel);transition:width .2s;overflow:hidden;height:100vh;position:sticky;top:0}
  [data-ide-shell] .ide-layout.panel-collapsed .ide-story-panel{width:0;border-left:none}
  [data-ide-shell] .ide-panel-expand-btn{display:none;position:fixed;top:10px;right:10px;z-index:40;width:28px;height:28px;border-radius:6px;border:1px solid var(--shell-border);background:var(--shell-panel);color:var(--shell-muted);cursor:pointer;font-size:12px}
  [data-ide-shell] .ide-layout.panel-collapsed .ide-panel-expand-btn{display:grid;place-items:center}
  [data-ide-shell] .ide-panel-header{padding:12px 14px 8px;border-bottom:1px solid var(--shell-border);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--shell-muted);white-space:nowrap}
  [data-ide-shell] .ide-panel-controls{flex:1;overflow-y:auto;padding:12px 14px;min-height:0}
  [data-ide-shell] .ide-section-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--shell-accent);margin:0 0 6px}
  [data-ide-shell] .ide-section-title:not(:first-child){margin-top:14px}
  [data-ide-shell] .ide-variant-card,[data-ide-shell] .ide-state-card{padding:8px 10px;border-radius:6px;border:1px solid var(--shell-border);margin-bottom:5px;cursor:pointer;transition:border-color .12s,background .12s}
  [data-ide-shell] .ide-variant-card:hover,[data-ide-shell] .ide-state-card:hover{border-color:#3f3f46}
  [data-ide-shell] .ide-variant-card.active,[data-ide-shell] .ide-state-card.active{border-color:var(--shell-accent);background:rgba(113,113,122,.1)}
  [data-ide-shell] .ide-variant-card h2{font-size:11px;font-weight:600;margin:0 0 2px}
  [data-ide-shell] .ide-variant-card p{margin:0;color:var(--shell-muted);font-size:10px;line-height:1.4}
  [data-ide-shell] .ide-state-card{font-size:10px;line-height:1.4;color:var(--shell-muted)}
  [data-ide-shell] .ide-state-card strong{display:block;color:var(--shell-text);font-size:10.5px}
  [data-ide-shell] .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px;font-size:10.5px;color:var(--shell-muted)}
  [data-ide-shell] .shell-seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--shell-border);border-radius:7px}
  [data-ide-shell] .shell-seg button{all:unset;cursor:pointer;padding:3px 8px;border-radius:5px;font-size:10px;color:var(--shell-muted)}
  [data-ide-shell] .shell-seg button.on{background:#2c2c31;color:var(--shell-text)}
  [data-ide-shell] .ide-panel-story{border-top:1px solid var(--shell-border);flex-shrink:0}
  [data-ide-shell] .ide-story-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:none;background:rgba(255,255,255,.02);color:var(--shell-muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
  [data-ide-shell] .ide-story-toggle:hover{color:var(--shell-text);background:rgba(255,255,255,.04)}
  [data-ide-shell] .ide-story-body{padding:0 14px 14px;font-size:11px;line-height:1.55;color:var(--shell-muted);max-height:230px;overflow-y:auto}
  [data-ide-shell] .ide-layout.story-collapsed .ide-story-body{display:none}
  [data-ide-shell] .ide-story-body h1{font-size:13px;font-weight:600;color:var(--shell-text);margin:0 0 6px}
  [data-ide-shell] .ide-story-body p{margin:0 0 8px}
  [data-ide-shell] .ide-story-body ul{margin:0 0 8px;padding-left:16px}
  [data-ide-shell] .ide-story-body li{margin-bottom:4px}
  [data-ide-shell] .ide-story-body b{color:var(--shell-text);font-weight:600}
  [data-ide-shell] .ide-story-body code{font:10.5px ui-monospace,Menlo,monospace;background:#232327;padding:0 4px;border-radius:4px;color:#d4d4d8}

</style>
<style id="design-styles">
@keyframes uspin{to{transform:rotate(360deg)}}
@keyframes upop{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
[data-ide-shell] .ide-artboard .design-root{
  --sb:#17171a;--bg:#141516;--card:#18191b;--text:#ececee;--muted:#8b8c92;
  --hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.08);--line:rgba(255,255,255,.07);--border:#333338;
  --accent:#0a84ff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;--blue:#4c9dff;
  --menu-bg:rgba(44,44,48,.97);--menu-border:rgba(255,255,255,.12);--scrim:rgba(0,0,0,.5);--pop-shadow:0 12px 32px rgba(0,0,0,.5);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-size:12px;line-height:1.3;color:var(--text);-webkit-font-smoothing:antialiased;
}
[data-ide-shell] .ide-artboard .design-root{
  & *{box-sizing:border-box}
  & button{all:unset;box-sizing:border-box;cursor:default;color:inherit;font:inherit}
  & button:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:1px}
  & svg.ico{flex:none;display:block}
  & .mut{color:var(--muted)}
  & .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  & code,& .mono{font:11px ui-monospace,Menlo,monospace}
  /* ----- the status slot (16px) ----- */
  & .slot{width:16px;height:16px;display:grid;place-items:center;flex:none;position:relative}
  & .si{display:block;flex:none}
  & .si.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--accent) 28%,transparent);border-top-color:var(--accent);animation:uspin .8s linear infinite}
  & .si.dot{width:7px;height:7px;border-radius:50%}
  & .si.att{background:var(--warn)}
  & .si.rev{background:var(--ok)}
  & .design-root[data-review="blue"] .si.rev,& [data-review="blue"] .si.rev{background:var(--blue)}
  & .si.ring{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);opacity:.7}
  & .si.svc{width:7px;height:7px;border-radius:2px;background:var(--ok)}
  & .portchip{font:10px ui-monospace,Menlo,monospace;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:5px;padding:0 4px;height:16px;display:inline-flex;align-items:center;flex:none}
  & [data-tip]:hover::after{content:attr(data-tip);position:absolute;z-index:50;right:0;top:calc(100% + 4px);background:#ececee;color:#18181b;border-radius:8px;padding:5px 10px;font-size:11px;white-space:nowrap;pointer-events:none}
  /* ----- window ----- */
  & .win{position:relative;display:grid;grid-template-columns:var(--sbw,262px) minmax(0,1fr);width:min(100%,1100px);margin:0 auto;height:clamp(560px,calc(100vh - 90px),720px);border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--bg);box-shadow:0 24px 60px rgba(0,0,0,.45)}
  & .sb{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--sb);border-right:1px solid var(--line)}
  & .sb-top{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px}
  & .tl{width:11px;height:11px;border-radius:50%;background:#56565b}
  & .vtabs{display:flex;gap:2px;padding:0 8px 8px;flex:none}
  & .vtab{flex:1;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
  & .vtab.on{background:var(--sel);color:var(--text)}
  & .sbody{flex:1;min-height:0;overflow:auto;padding:0 8px 10px}
  & .sh{display:flex;align-items:center;gap:4px;height:26px;padding:0 6px;font-weight:600;flex:none}
  & .sh .cnt{margin-left:auto;font-weight:400;font-size:10.5px;color:var(--muted)}
  & .sh .ib{width:20px;height:20px}
  & .glab{height:22px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:color-mix(in srgb,var(--muted) 78%,transparent)}
  & .row{position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 8px;border-radius:7px;min-width:0}
  & .row:hover{background:var(--hover)}
  & .row.on{background:var(--sel)}
  & .row .nm{flex:1;min-width:0;font-weight:500}
  & .row .br{font-size:10.5px;color:var(--muted);flex:none;width:58px;text-align:right}
  & .row .br.dirty{color:var(--warn)}
  & .row .pc{font-size:10px;color:var(--muted);flex:none;width:12px;text-align:right}
  & .row .ago{font-size:10.5px;color:var(--muted);flex:none}
  & .tile{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
  & .mk{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
  & .foot{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
  & .main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
  & .tb{height:38px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px;min-width:0}
  & .tb h1{font-size:16px;font-weight:650;margin:0 0 0 6px}
  & .ib{position:relative;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
  & .ib:hover,& .ib.on{background:var(--sel);color:var(--text)}
  & .grow{flex:1}
  & .trig{position:relative;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:8px;color:var(--muted);flex:none}
  & .trig:hover,& .trig.on{background:var(--sel);color:var(--text)}
  & .cnt2 b{font-weight:650;color:var(--ok)}
  & .btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--border);font-weight:500}
  & .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  & .btn:hover{filter:brightness(1.12)}
  & .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;color:var(--muted)}
  & .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  & .kbd{font:10px ui-monospace,Menlo,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;height:17px;display:inline-grid;place-items:center;color:var(--muted)}
  /* ----- popover ----- */
  & .pop{position:absolute;top:40px;right:10px;z-index:30;width:var(--popw,340px);background:var(--menu-bg);border:1px solid var(--menu-border);border-radius:12px;box-shadow:var(--pop-shadow);padding:6px;animation:upop .14s ease-out}
  & .seg{display:flex;gap:2px;padding:2px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  & .seg>button{flex:1;min-width:0;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;color:var(--muted);font-weight:500}
  & .seg>button.on{background:rgba(255,255,255,.1);color:var(--text)}
  & .seg>button .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  & .seg>button .n{font-size:10px;color:var(--muted)}
  & .prow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}
  & .prow:hover{background:var(--hover)}
  & .prow .two{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  & .prow small{font-size:10.5px;color:var(--muted)}
  & .plab{display:flex;align-items:center;gap:6px;padding:8px 8px 3px;font-size:10.5px;color:var(--muted);font-weight:600}
  & .chips{display:flex;gap:4px;padding:4px 6px 2px;flex-wrap:wrap}
  & .chip{height:22px;border-radius:11px;border:1px solid var(--line);padding:0 9px;display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
  & .chip.on{background:var(--sel);color:var(--text);border-color:var(--border)}
  /* ----- command center ----- */
  & .scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
  & .cc{position:absolute;z-index:30;top:70px;left:50%;transform:translateX(-50%);width:560px;background:var(--menu-bg);border:1px solid var(--menu-border);border-radius:12px;box-shadow:var(--pop-shadow);overflow:hidden;animation:upop .14s ease-out}
  & .cc input{all:unset;box-sizing:border-box;width:100%;height:42px;padding:0 14px;font-size:14px;color:var(--text);border-bottom:1px solid var(--line)}
  & .cc input::placeholder{color:var(--muted)}
  & .cc .list{max-height:370px;overflow:auto;padding:4px 6px}
  & .cc .sec{padding:8px 8px 3px;font-size:10px;font-weight:650;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
  & .cc .it{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:7px}
  & .cc .it.sel{background:rgba(10,132,255,.22)}
  & .cc .it .k{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:10.5px}
  & .cc .it .kind{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:0 5px;height:16px;display:inline-flex;align-items:center}
  & .cc .foot2{display:flex;gap:12px;padding:7px 12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
  & .cc .modes{display:flex;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--muted);align-items:center}
  & .cc .modes code{background:rgba(255,255,255,.07);border-radius:4px;padding:0 5px}
  & .hostrow .two{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  & .hostrow{height:40px}
  & .hostrow small{font-size:10.5px;color:var(--muted)}
  & .legend{width:260px;padding:8px}
  & .legend .lg{display:flex;align-items:center;gap:10px;padding:5px 4px}
  & .note{position:absolute;left:12px;bottom:12px;z-index:40;font-size:11px;color:var(--muted);background:rgba(0,0,0,.4);padding:4px 8px;border-radius:6px}

  /* ----- ux-audit-2 additions ----- */
  & .stack{display:flex;flex-direction:column;width:min(100%,1100px);margin:0 auto;position:relative}
  & .stack .win{margin:0;height:clamp(520px,calc(100vh - 120px),700px);border-top-left-radius:0;border-top-right-radius:0}
  & .mbar{display:flex;align-items:center;gap:2px;height:26px;padding:0 12px;background:rgba(40,40,44,.96);border:1px solid var(--border);border-bottom:none;border-radius:10px 10px 0 0;font-size:12px;position:relative}
  & .mbar>span{padding:3px 9px;border-radius:5px;color:var(--text)}
  & .mbar>span.ap{font-weight:700}
  & .mbar>span.on{background:var(--accent);color:#fff}
  & .menu{position:absolute;top:26px;z-index:60;min-width:290px;background:var(--menu-bg);border:1px solid var(--menu-border);border-radius:8px;box-shadow:var(--pop-shadow);padding:5px;animation:upop .12s ease-out}
  & .mi2{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:4px 10px;border-radius:5px;font-size:12px}
  & .mi2 .k{color:var(--muted);font:11.5px -apple-system,system-ui;letter-spacing:.04em}
  & .mi2.new{background:rgba(48,209,88,.13)}
  & .mi2.new .k{color:#7fe3a0}
  & .mi2.sep{height:1px;padding:0;margin:4px 6px;background:var(--line)}
  & .mi2.dim{color:var(--muted)}
  & .tabs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;padding-left:4px}
  & .tab{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:8px;max-width:150px;min-width:0;color:var(--muted)}
  & .tab.on{background:var(--sel);color:var(--text)}
  & .tab .t{font-size:11.5px}
  & .tab .x{width:14px;height:14px;display:grid;place-items:center;border-radius:4px;opacity:.6}
  & .tab .hint{font:10px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 3px;flex:none}
  & .tip2{position:absolute;z-index:50;background:#ececee;color:#18181b;border-radius:8px;padding:5px 10px;font-size:11px;display:flex;gap:6px;align-items:center;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  & .tip2 .kbd{background:#fff;color:#444;border-color:#c8c8cc}
  & .term{flex:1;min-height:0;margin:8px;border-radius:10px;border:1px solid var(--line);background:#101112;padding:12px 14px;font:11.5px/1.55 ui-monospace,Menlo,monospace;color:#b9bac0;overflow:hidden}
  & .term b{color:#7fe3a0;font-weight:600}
  & .sheet{position:absolute;z-index:40;top:74px;left:50%;transform:translateX(-50%);width:700px;background:var(--menu-bg);border:1px solid var(--menu-border);border-radius:12px;box-shadow:var(--pop-shadow);padding:14px 18px 12px;animation:upop .14s ease-out}
  & .sheet h3{margin:0 0 8px;font-size:13px;font-weight:650;display:flex;justify-content:space-between}
  & .sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
  & .sheet .grp{font-size:10px;font-weight:650;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin:8px 0 3px}
  & .sheet .kr{display:flex;align-items:center;justify-content:space-between;height:23px;font-size:12px}
  & .sheet .kr.new .kbd{border-color:rgba(48,209,88,.5);color:#7fe3a0}
  & .sheet .kr.no .kbd{opacity:.45;border-style:dashed}
  & .sheet .kk{display:flex;gap:3px}
  /* sessions */
  & .sbar{display:flex;align-items:center;gap:8px;padding:6px 14px 2px}
  & .pill2{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:7px;color:var(--muted);font-size:11.5px}
  & .pill2.on{background:var(--sel);color:var(--text)}
  & .srch{margin-left:auto;display:flex;align-items:center;gap:6px;width:190px;height:26px;border-radius:8px;border:1px solid var(--border);padding:0 8px;color:var(--muted)}
  & .slist{flex:1;min-height:0;overflow:auto;padding:4px 14px 14px}
  & .sgl{font-size:10.5px;font-weight:650;letter-spacing:.04em;color:var(--muted);padding:10px 6px 4px;text-transform:uppercase}
  & .srow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;min-width:0;position:relative}
  & .srow:hover,& .srow.hov{background:var(--hover)}
  & .srow.sel{background:var(--sel)}
  & .srow .two{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  & .srow .tt{font-weight:600;font-size:12.5px}

  const tt=title==='raw'&&r.raw?r.raw:r.t;
  const cls=title==='raw'&&r.raw?' bad':'';
  return `<div class="srow ${r.hov&&acts?'hov':''} ${sel?'sel':''}">${mark(r.p==='codex'?'codex':'omp')}<span class="two"><span class="tt t${cls}">${tt}</span><small class="t">${r.m}</small></span>
   ${acts&&r.hov?`<span class="acts"><button class="btn pri" style="height:24px">Continue</button><button class="ib" style="width:24px;height:24px">${ic('more',14)}</button></span>`:''}
   <span class="tok">${r.tok}<small>tokens</small></span><span class="when">${r.w}</span></div>`;
}
function sList(opts){
  let h='';let last='';
  SROWS.forEach((r,i)=>{
    if(S.sessGroup==='day'&&r.day!==last){h+=`<div class="sgl">${r.day}</div>`;last=r.day}
    h+=sRow(r,opts(r,i));
    if(opts.after)h+=opts.after(r,i)||'';
  });
  return h;
}
function sToolbar(){return `<div class="sbar"><span class="pill2 on">All <span class="mut">7</span></span><span class="pill2">${mark('codex')} Codex <span class="mut">1</span></span><span class="pill2">${mark('omp')} Oh My Pi <span class="mut">6</span></span><span class="srch">${ic('search',13)} Search</span><span class="pill2">${ic('check',12)} Select</span></div>`}
function tSess(){
  const v=S.sess;let inner;
  if(v==='A'){
    if(S.sessView==='read'){
      inner=`<div class="tr-h"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px;flex:1">🔍 SEARCH: Rearrange titlebar search and nav buttons</b><button class="btn pri" style="height:26px">${ic('play',11)} Continue</button><button class="btn" style="height:26px">Continue in ▾</button><button class="ib">${ic('more',14)}</button></div><small class="mut">Oh My Pi · 20 messages · Oct 29 17:37 → Oct 30 09:34 · 213k tokens ${ic('info',12)}</small></div>
       <div class="msg u"><div class="who">You</div>SEARCH: Rearrange titlebar search and nav buttons — put search left of the nav arrows…</div><div class="msg"><div class="who">Agent</div>Rearranged: the search button now sits…</div>`;
    }else if(S.sessView==='info'){
      inner=sToolbar()+`<div class="slist">`+sList((r,i)=>({title:'fixed',acts:true})).replace(/(<div class="srow hov"[\s\S]*?<\/div><\/div>)/,'$1')+`</div><div class="pop" style="top:226px;right:90px;--popw:420px;padding:12px">${factsCompact(false).replace('class="facts"','style="margin:0;padding:0;display:grid;background:none;border:none;grid-template-columns:70px 1fr;gap:5px 10px" class="facts2"').replace('grid-template-columns:70px 1fr 70px 1fr','grid-template-columns:70px 1fr')}</div>`;
    }else{
      inner=sToolbar()+`<div class="slist">${sList((r,i)=>({title:'fixed',acts:true}))}</div>`;
    }
  }else if(v==='B'){
    inner=`<div class="split"><div class="l">${sToolbar().replace('<span class="srch">'+ic('search',13)+' Search</span>','').replace('<span class="pill2">'+ic('check',12)+' Select</span>','')}${sList((r,i)=>({title:'fixed',sel:i===3}))}</div>
     <div class="r"><div class="tr-h"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px;flex:1" class="t">🔍 SEARCH: Rearrange titlebar search and nav buttons</b><button class="btn pri" style="height:26px">${ic('play',11)} Continue</button><button class="btn" style="height:26px">Continue in ▾</button><button class="ib">${ic('more',14)}</button></div><small class="mut">20 messages · 2.7 MB · Oct 29 17:37 → Oct 30 09:34 · ${ic('info',11)} facts</small></div>
      <div style="overflow:hidden"><div class="msg u"><div class="who">You</div>SEARCH: Rearrange titlebar search and nav buttons — search left of the nav arrows, keep ⌘K…</div><div class="msg"><div class="who">Agent</div>Rearranged: the search button now sits beside the sidebar toggle; Back/Forward stay at the head of the trailing tools…</div><div class="msg u"><div class="who">You</div>Also fix the tooltip order.</div><div class="msg"><div class="who">Agent</div>Done — tooltips now read Back (⌘[) …</div></div></div></div>`;
  }else{
    const showCmd=S.sessView==='cmds';
    inner=sToolbar()+`<div class="slist">${sList(Object.assign((r,i)=>({title:'fixed',acts:false}),{after:(r,i)=>i===3?`<div class="srow sel" style="margin-top:-2px;border-radius:9px 9px 0 0;padding:0"></div>${factsCompact(showCmd).replace('margin','margin')}<div style="display:flex;gap:6px;margin:-4px 10px 8px 48px"><button class="btn pri" style="height:26px">${ic('play',11)} Continue</button><button class="btn" style="height:26px">Continue in ▾</button><button class="btn" style="height:26px">View Session</button><button class="btn" style="height:26px">Export…</button></div>`:''}))}</div>`;
  }
  return {stage:winX(inner,{view:'hist',sb:sbSess,tb:`<h1>Sessions</h1>`})};
}

/* ============ T3 · Changes — clean tree ============ */
const COMMITS=[['a2a7b07','fix(nativeui): align Workspace row meta into fixed columns','2h'],['009c35c','feat(nativeui): service square in the status slot','1h'],['39c8ea2','feat(nativeui): Command Center scope chips','1h'],['4310ef1','feat(nativeui): Files/Hosts start pages','40m']];
const gitTb=(ahead)=>`<h1>Changes</h1><span class="grow"></span><span class="ib on">${ic('folder',14)}</span><span class="ib" style="width:auto;padding:0 6px;gap:3px;color:var(--ok)">${ahead>0?`↑${ahead}`:''}</span><span class="ib">${ic('up',14)}</span>`;
function tClean(){
  const v=S.clean,ahead=+S.ahead;
  const push=ahead>0?`<span class="ahead">${ic('up',11)} ${ahead} ahead of origin/main</span>`:`<span class="mut" style="font-size:11px">Up to date with origin/main</span>`;
  let inner;
  const crow=(c,i)=>`<div class="cmrow">${ic('commit',14)}<span class="h">${c[0]}</span><span class="t" style="flex:1">${c[1]}</span><span class="au">${c[2]}${i<ahead?' · unpushed':''}</span>${i<ahead?`<span class="ahead" style="height:16px">↑</span>`:''}</div>`;
  if(v==='A'){
    inner=`<div style="padding:22px 28px;max-width:640px"><div style="display:flex;align-items:center;gap:12px">${ic('check',20,2)}<div><div style="font-size:15px;font-weight:650">Working tree clean</div><div class="mut" style="margin-top:2px;display:flex;gap:8px;align-items:center">main · ${push}</div></div><span class="grow"></span>${ahead>0?`<button class="btn pri">${ic('up',12)} Push ${ahead} commit${ahead>1?'s':''}</button>`:`<button class="btn">Fetch</button>`}</div>
      <div class="sgl" style="margin-top:18px">Recent commits</div>${COMMITS.slice(0,3).map(crow).join('')}<div style="margin-top:10px;display:flex;gap:8px"><button class="btn">View all commits</button><button class="btn">Open Terminal</button></div></div>`;
  }else if(v==='B'){
    inner=`<div class="tint" style="margin:10px 14px 0">${ic('check',14,2)}<b>Working tree clean</b><span class="mut">·</span>${push}<span class="grow"></span>${ahead>0?`<button class="btn pri" style="height:24px">${ic('up',11)} Push ${ahead}</button>`:''}<button class="btn" style="height:24px">Open Terminal</button></div>
      <div class="sgl" style="margin:6px 20px 0">Commits · main</div><div style="padding:0 12px;flex:1;overflow:hidden">${COMMITS.concat(COMMITS.map(c=>[c[0].split('').reverse().join(''),'chore: earlier change '+c[0].slice(0,3),'2d'])).map(crow).join('')}</div>`;
  }else{
    inner=`<div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px">${ic('doc',16)}<div><b>Working tree clean</b><div class="mut" style="font-size:11px">~/Workspaces/wh-studio/solco</div></div><span class="grow"></span><button class="btn">View Commits</button><button class="btn pri">Open Terminal</button></div><div class="center" style="color:var(--muted)"></div>`;
  }
  return {stage:winX(inner,{view:'git',sb:sbGit,tb:gitTb(ahead)})};
}

/* ============ T4 · bugs ============ */
function tBugs(){
  const rows=(hl)=>`<div class="row">${tile('L','#9b6dff')}<span class="nm t">Local Server</span><span class="br dirty">main</span><span class="pc">2</span></div><div class="row ${hl?'on':''}">${tile('S','#e5484d')}<span class="nm t">solco</span><span class="br dirty">main</span><span class="pc">5</span></div><div class="row">${tile('G','#5b6ee1')}<span class="nm t">getaipages</span><span class="br dirty">main</span><span class="pc">3</span></div>`;
  const inner=`<div class="bugs"><div class="bx"><h4>Bug 1 · 当前 Workspace 在侧栏不高亮（Tab 栏模式回归）</h4><div class="ba"><div><div class="lab">现在</div><div style="background:var(--sb);border-radius:10px;padding:6px">${rows(false)}</div></div><div><div class="lab">修复后</div><div style="background:var(--sb);border-radius:10px;padding:6px">${rows(true)}</div></div></div><p class="mut" style="font-size:11px;line-height:1.5;margin:8px 0 0"><code>project_tree.go:47</code> 条件 <code>selectedProject &amp;&amp; selectedTabID == ""</code>；Tab 栏模式下树里没有 Tab 行，<code>selectedTabID</code> 恒非空 ⇒ 当前 Workspace 永不高亮。</p></div>
   <div class="bx"><h4>Bug 2 · Codex 会话标题是注入的 AGENTS.md 指令</h4><div class="ba" style="grid-template-columns:1fr"><div><div class="lab">现在</div><div class="srow bad" style="padding:6px 8px">${mark('codex')}<span class="two"><span class="tt t">${SROWS[0].raw}</span><small>Codex · 127 messages</small></span></div></div><div><div class="lab">修复后</div><div class="srow good" style="padding:6px 8px">${mark('codex')}<span class="two"><span class="tt t">${SROWS[0].t}</span><small>Codex · 127 messages</small></span></div></div></div><p class="mut" style="font-size:11px;line-height:1.5;margin:8px 0 0"><code>history/parse_utils.go injectedUserContent</code> 的前缀表没有 <code># AGENTS.md instructions for</code>，它被当成真实首条用户消息。补一个前缀即可，标题改取下一条真实消息。</p></div></div>`;
  return {stage:winX(inner,{view:'term',sb:sbWork(false),tb:`<h1 style="margin-left:6px">Bugs（直接修，无需选型）</h1>`})};
}

/* ================= controller ================= */
const TOPICS=[
 {id:'keys',key:'keys',name:'1 · 快捷键与 Tab 导航',vars:{A:['A · 页面 ⌘1–5，Tab ⌘⌥1–9','保留 ⌘1 = Workspace；⌘2–5 = 其余四页（与侧栏图标同序）；Tab：⌘T 新建、⌥⌘1–9 选择'],B:['B · 浏览器式：⌘1–9 选 Tab','⌘T / ⌘1–9 / ⇧⌘[ ] 如 Safari；页面改 ⌃1–5（⌘1 的现有含义被让出）'],C:['C · 不加键，只补速查表','Help ▸ Keyboard Shortcuts (⌘/) 列出现有键；让缺口自己可见']},
  ctl:()=>`<div class="ctl">呈现<span class="shell-seg">${[['menu','Go 菜单'],['menuTab','Tab 菜单'],['sheet','速查表'],['tip','悬停提示']].map(([k,l])=>`<button class="${S.keysView===k?'on':''}" data-set="keysView=${k}">${l}</button>`).join('')}</span></div>`,render:tKeys},
 {id:'sess',key:'sess',name:'2 · Sessions 行：点哪里',vars:{A:['A · 点行=阅读，ⓘ=信息','行点击直接打开会话；悬停出现 Continue / ⋯；信息收进 ⓘ 小卡'],B:['B · 分栏预览','左列表右对话预览（像 Mail），Continue 在预览头部'],C:['C · 保持展开，只做清理','仍是行内展开，但事实压成两列、命令默认折叠、按天分组']},
  ctl:()=>`<div class="ctl">状态<span class="shell-seg">${(S.sess==='A'?[['list','列表'],['info','ⓘ 信息'],['read','阅读']]:S.sess==='C'?[['list','展开'],['cmds','展开命令']]:[['list','预览']]).map(([k,l])=>`<button class="${S.sessView===k?'on':''}" data-set="sessView=${k}">${l}</button>`).join('')}</span></div><div class="ctl">按天分组<span class="shell-seg"><button class="${S.sessGroup==='day'?'on':''}" data-set="sessGroup=day">开</button><button class="${S.sessGroup!=='day'?'on':''}" data-set="sessGroup=off">关</button></span></div>`,render:tSess},
 {id:'clean',key:'clean',name:'3 · Changes 干净态',vars:{A:['A · 状态页','Push N commits 主按钮 + 最近提交 + 去 Commits/终端'],B:['B · 直接落到 Commits','干净时顶部一条状态条，下面就是提交列表'],C:['C · 只收窄','去掉空的左栏与分隔线，保持一个横幅（最小改动）']},
  ctl:()=>`<div class="ctl">未推送提交<span class="shell-seg"><button class="${S.ahead==='2'?'on':''}" data-set="ahead=2">2 个</button><button class="${S.ahead==='0'?'on':''}" data-set="ahead=0">0 个</button></span></div>`,render:tClean},
 {id:'bugs',key:'t',name:'4 · Bug（直接修）',vars:{A:['2 个 Bug','当前 Workspace 不高亮；Codex 标题是注入指令']},ctl:()=>'',render:tBugs}
];
const STORY={
 keys:`<h1>议题 1 · 快捷键与 Tab 导航</h1><p><b>现状证据</b>：<code>app_menu.go</code> 只有 ⌘1 / ⌘, / ⌘W / ⇧⌘P；Go 菜单里 Changes/Sessions/Files/Hosts 无加速键（巡检台账 F190 早已记下）；Tab 栏默认放到标题栏后，<b>没有 ⌘T、没有按序号选 Tab</b>，“+” 的提示也没有键；整个 app 没有任何快捷键速查（⌘/ 或 Help 菜单）。</p><ul><li><b>A</b> 不动 ⌘1 的现有含义，把 ⌘2–5 补齐，Tab 用 ⌥⌘ 序号；与 Terminal 里 ⌘ 数字冲突最小。</li><li><b>B</b> 与浏览器肌肉记忆一致，但要让出 ⌘1，页面键改 ⌃1–5（⌃ 在终端里常被程序占用，需实测）。</li><li><b>C</b> 零冲突，但缺口依旧，只是让用户看得见。</li></ul><p><b>约束</b>：tooltip 的键帽必须取自真正生效的绑定（<code>shortcutBinding</code>）；快捷键只做导航，不新增 Herdr 方法。</p>`,
 sess:`<h1>议题 2 · Sessions 行</h1><p><b>现状证据</b>：点行只是展开一块“调试信息”——两条很长的 <code>cd … &amp;&amp; omp --session …</code> 命令、Session ID、文件路径；<b>真正要做的两件事（读对话、继续）一个在最底、一个在行右</b>。“This project” 下还有一条重复的单组头。Codex 标题被注入指令污染（见议题 4）。</p><ul><li><b>A</b> 路径最短：点行即读；Continue 悬停可见；信息降级为 ⓘ。</li><li><b>B</b> 扫读最快，适合 500 条的 All sessions，但中栏要吃掉宽度。</li><li><b>C</b> 改动最小，保留现有习惯。</li></ul><p>三案都：删单组头、修脏标题、按天分组（可关）。</p>`,
 clean:`<h1>议题 3 · Changes 干净态</h1><p><b>现状证据</b>：干净时只有一条细横幅，左侧留一列“0 files”的空栏和分隔线，下面大片空白；而标题栏明明在提示 <b>↑2</b> 未推送——页面却不说这件事。</p><ul><li><b>A</b> 把干净态变成“下一步”页：同步状态 + 一个主按钮（Push 2 commits）+ 最近提交。</li><li><b>B</b> 干净就当 Commits 看，横幅一条；少一层页面，但 Changes 与 Commits 的边界变模糊。</li><li><b>C</b> 只去掉空栏；不解决“白板”。</li></ul>`,
 bugs:`<h1>议题 4 · Bug（无需选型）</h1><p>两处明确的缺陷，修复方式唯一，计划随本轮一起修：</p><ul><li><b>Workspace 不高亮</b>：我在上一轮把 Tab 移到标题栏时引入的回归。</li><li><b>Codex 标题</b>：<code># AGENTS.md instructions for …</code> 被当作用户消息。</li></ul>`
};
function render(){
  const T=TOPICS.find(t=>t.id===S.t);
  if(S.t==='sess'&&!['list','info','read','cmds'].includes(S.sessView))S.sessView='list';
  const r=T.render();
  const root=$('#root');root.innerHTML=r.stage+`<div class="note">${T.name} · 方案 ${S[T.key]}</div>`;
  const h=$('#ctlHost');
  h.innerHTML=`<div class="ide-section-title">议题</div>`+TOPICS.map(t=>`<div class="ide-variant-card ${t.id===S.t?'active':''}" data-topic="${t.id}"><h2>${t.name}</h2></div>`).join('')+
   `<div class="ide-section-title">方案</div>`+Object.entries(T.vars).map(([k,[a,b]])=>`<div class="ide-variant-card ${S[T.key]===k?'active':''}" data-var="${k}"><h2>${a}</h2><p>${b}</p></div>`).join('')+
   `<div class="ide-section-title">状态 / 控制</div>`+T.ctl();
  $('#storyBody').innerHTML=STORY[S.t]||'';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-topic],[data-var],[data-set]');if(!t)return;
  if(t.dataset.topic){S.t=t.dataset.topic;if(S.t==='sess')S.sessView='list'}
  else if(t.dataset.var){S[TOPICS.find(x=>x.id===S.t).key]=t.dataset.var;if(S.t==='sess')S.sessView='list'}
  else if(t.dataset.set){const[k,v]=t.dataset.set.split('=');S[k]=v}
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ideLayout').classList.toggle('panel-collapsed')});
$('#collapseBtn').onclick=()=>$('#ideLayout').classList.add('panel-collapsed');
$('#expandBtn').onclick=()=>$('#ideLayout').classList.remove('panel-collapsed');
$('#storyToggle').onclick=()=>{const l=$('#ideLayout');l.classList.toggle('story-collapsed');$('#storyCaret').textContent=l.classList.contains('story-collapsed')?'▸':'▾'};
render();
</script>
